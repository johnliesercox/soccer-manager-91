}

// ---------- Careers: sackings, resignations, job offers ----------
function bottomClub(state){
  const tb = tableFor(state, 4).filter(c=>!isHuman(state, c.id));
  return tb[tb.length-1].id;
}
function moveManager(state, clubId){
  const old = state.clubs[state.userClub];
  { const cr = careerOf(state.managers[state.cur]); const last = cr.clubs[cr.clubs.length-1]; if (last && last.id===old.id) last.to = state.season; }
  old.xi = null; for (const p of squadOf(state,old)) p.listed = null;
  if (old.players.length<16 && !state.managers.some(m=>!m.retired && m!==state.managers[state.cur] && m.userClub===old.id)) youthFill(state, old, 16);
  const c = state.clubs[clubId];
  state.userClub = c.id; c.confidence = CFG.CONF_START; c.overdraftWeeks = 0; c.ledger = []; c.xi = null; c.training = 'normal';
  state.offers = []; state.loan = null; state.jobOffer = null; state.sackOffer = null; state.gameOver = null;
  if (state.preseason && state.preseason.pending){ state.preseason.offers = sponsorOffers(state, c); state.sponsor = null; state.seasonTicket = null; }
  else { state.sponsor = null; state.seasonTicket = null; }
  transferWeek(state);
}
function takeSackOffer(state){
  const id = state.sackOffer; if (id===null || id===undefined) return 'No offer on the table.';
  const c = state.clubs[id];
  moveManager(state, id);
  news(state, `You start again at ${c.name}, bottom of Division 4. The only way is up. Probably.`, 'job');
  return null;
}
function resign(state){
  const u = state.clubs[state.userClub];
  state.gameOver = `You resigned from ${u.name}.`;
  state.sackOffer = bottomClub(state);
}
function midSeasonJobs(state, user){
  if (![12,21,30].includes(state.week) || state.jobOffer!==null || state.gameOver) return;
  updatePositions(state);
  const exp = expectedPos(state, user);
  const cupRun = ['lc','fa'].some(k=>!user.cup[k].out && user.cup[k].round>=3);
  if (!(user.leaguePos <= exp-4 || cupRun) || rand()>0.3) return;
  const cands = state.clubs.filter(c=>c.div>=1 && !isHuman(state, c.id) && c.prestige>user.prestige+8 && c.prestige<=user.prestige+24);
  if (!cands.length) return;
  const c = pick(cands);
  state.jobOffer = c.id; state.jobOfferExpires = state.week+2;
  news(state, `${c.name} have sacked their manager and want to talk to you. Decide within two weeks.`, 'job');
}

// ---------- Transfers ----------
function transferWeek(state){
  const user = state.clubs[state.userClub];
  // refresh transfer list: 8 fringe players from nearby divisions
  const pool = [];
  for (const c of state.clubs){
    if (isHuman(state, c.id) || c.div===0 || Math.abs(c.div-user.div)>1 || c.players.length<15) continue;
    const sq = squadOf(state,c).slice().sort((a,b)=>b.skill-a.skill);
    for (const p of sq.slice(8)) pool.push(p);
  }
  shuffle(pool);
  const n = CFG.SCOUT_LIST[user.staff.scout];
  let list = pool.slice(0, n);
  if (user.staff.scout>=2){
    // a good scout finds a couple of young players with something about them
    const gems = pool.filter(p=>p.age<=23 && p.pot-p.skill>=10 && !list.includes(p)).slice(0, user.staff.scout>=3? 3 : 2);
    list = gems.concat(list).slice(0, n);
  }
  state.transferList = list.map(p=>({pid:p.id, price: round500(p.value*(0.9+0.2*rand()))}));
  // offers for listed players
  state.offers = state.offers.filter(o=>o.expires>state.week && o.season===state.season);
  for (const p of squadOf(state,user)){
    if (p.listed===null && !p.requested) continue;
    const askRatio = p.listed===null? 1 : p.listed/Math.max(p.value,1);
    const chance = askRatio<=1? 0.35 : askRatio<=1.3? 0.2 : 0.08;
    if (rand()<chance){
      const buyers = state.clubs.filter(c=>!isHuman(state, c.id) && c.div<=Math.min(4,user.div+1) && c.players.length<20);
      if (!buyers.length) continue;
      const buyer = pick(buyers);
      const amount = round500(Math.min(p.listed===null? p.value*1.1 : p.listed, p.value*(0.85+0.3*rand())));
      state.offers.push({pid:p.id, club:buyer.id, name:buyer.name, amount, expires: state.week+2, season: state.season});
      news(state, `${buyer.name} offer £${fmt(amount)} for ${p.name}.`, 'offer');
    }
  }
  // european raid
  if (user.div<=3 && rand()<0.04){
    const best = squadOf(state,user).slice().sort((a,b)=>b.skill-a.skill)[0];
    const raiders = divClubs(state,0).filter(c=>c.rating>=72 && c.players.length<20);
    if (best && best.skill>=60 && best.age<=30 && raiders.length){
      const buyer = pick(raiders);
      const amount = round500(best.value*(1.8+1.2*rand()));
      state.offers.push({pid:best.id, club:buyer.id, name:buyer.name, amount, expires: state.week+2, season: state.season, euro:true});
      news(state, `${buyer.name} want ${best.name}. They are offering £${fmt(amount)}.`, 'offer');
    }
  }
}
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function buyFromList(state, pid){
  const user = state.clubs[state.userClub];
  const entry = state.transferList.find(t=>t.pid===pid); if (!entry) return 'Not on the list any more.';
  const p = state.players[pid]; const seller = p? state.clubs[p.club] : null;
  if (!p || !seller || seller.id===user.id){ state.transferList = state.transferList.filter(t=>t.pid!==pid); return 'He is no longer available.'; }
  if (user.players.length>=20) return 'Squad is full (20 max).';
  if (user.balance - entry.price < -overdraftLimit(state, user)) return 'The bank will not fund that.';
  movePlayer(state, p, seller, user, entry.price); credit(state, user, -entry.price, `Bought ${p.name}`);
  state.transferList = state.transferList.filter(t=>t.pid!==pid);
  news(state, `Signed ${p.name} from ${seller.name} for £${fmt(entry.price)}.`, 'transfer');
  return null;
}
function bidForPlayer(state, pid, amount){
  const user = state.clubs[state.userClub];
  const p = state.players[pid]; const seller = state.clubs[p.club];
  if (!seller || seller.id===user.id) return 'Not available.';
  if (user.players.length>=20) return 'Squad is full (20 max).';
  if (user.balance - amount < -overdraftLimit(state, user)) return 'The bank will not fund that.';
  const sm = managerOf(state, seller.id);
  if (sm){
    if (sm.offers.some(o=>o.pid===p.id && o.human===state.cur)) return 'You already have a bid in for him.';
    sm.offers.push({pid:p.id, club:user.id, name:`${user.name} (${state.managerName})`, amount, expires: state.week+2, season: state.season, human: state.cur});
    const arr = sm.news; arr.unshift({s:state.season, w:state.week, text:`${state.managerName} at ${user.name} have bid £${fmt(amount)} for ${p.name}.`, kind:'offer'}); if (arr.length>40) arr.pop();
    news(state, `Bid of £${fmt(amount)} for ${p.name} sent to ${sm.managerName}. They decide on their turn.`, 'transfer');
    return null;
  }
  if (seller.players.length<=14) return `${seller.name} will not sell, they are short of players.`;
  const since = weeksSinceSigning(state, p);
  if (since < CFG.RESALE_WEEKS) return `${seller.name} only signed him ${since===0? 'this week' : since+' week'+(since===1?'':'s')+' ago'}. They are not listening.`;
  const ratio = amount/Math.max(p.value, p.paid||0);
  const acc = ratio>=1.6? 0.95 : ratio>=1.3? 0.55 : ratio>=1.1? 0.2 : 0.03;
  if (rand()>acc){ news(state, `${seller.name} reject your £${fmt(amount)} bid for ${p.name}.`, 'transfer'); return 'Bid rejected.'; }
  movePlayer(state, p, seller, user, amount); credit(state, user, -amount, `Bought ${p.name}`);
  state.transferList = state.transferList.filter(t=>t.pid!==pid);
  news(state, `Signed ${p.name} from ${seller.name} for £${fmt(amount)}.`, 'transfer');
  return null;
}
function acceptOffer(state, offerIdx){
  const user = state.clubs[state.userClub];
  const o = state.offers[offerIdx]; if (!o) return 'Offer gone.';
  const p = state.players[o.pid];
  if (user.players.length<=11) return 'You cannot go below 11 players.';
  if (o.human!==undefined){
    const buyer = state.clubs[o.club]; const bm = state.managers[o.human];
    if (!bm || bm.retired || bm.userClub!==buyer.id){ state.offers = state.offers.filter(x=>x!==o); return 'That manager has moved on. Bid withdrawn.'; }
    if (buyer.players.length>=20){ state.offers = state.offers.filter(x=>x!==o); return `${buyer.name} have a full squad now. Bid withdrawn.`; }
    if (buyer.balance - o.amount < -overdraftLimit(state, buyer)){ state.offers = state.offers.filter(x=>x!==o); return `${bm.managerName} can no longer afford it. Bid withdrawn.`; }
    movePlayer(state, p, user, buyer, o.amount);
    credit(state, user, o.amount, `Sold ${p.name}`); credit(state, buyer, -o.amount, `Bought ${p.name}`);
    const arr = bm.news; arr.unshift({s:state.season, w:state.week, text:`${state.managerName} accepted. ${p.name} joins ${buyer.name} for £${fmt(o.amount)}.`, kind:'transfer'}); if (arr.length>40) arr.pop();
    news(state, `${p.name} sold to ${buyer.name} for £${fmt(o.amount)}.`, 'transfer');
    state.offers = state.offers.filter(x=>x.pid!==o.pid);
    return null;
  }
  if (o.euro && o.club<0){ removePlayer(state, p, user); } else { movePlayer(state, p, user, state.clubs[o.club], o.amount); }
  credit(state, user, o.amount, `Sold ${p.name}`);
  news(state, `${p.name} sold to ${o.name} for £${fmt(o.amount)}.`, 'transfer');
  state.offers = state.offers.filter(x=>x.pid!==o.pid);
  return null;
}
function weeksSinceSigning(state, p){ if (p.signedS===undefined) return 999; return (state.season-p.signedS)*CFG.WEEKS + (state.week-p.signedW); }
function movePlayer(state, p, from, to, price){
  recordFee(state, p, from, to, price);
  from.players = from.players.filter(id=>id!==p.id); to.players.push(p.id); p.club = to.id; p.listed = null;
  p.paid = price!==undefined? price : p.value; p.signedS = state.season; p.signedW = state.week;
  p.wage = Math.max(p.wage||0, wageFor(p.skill)); p.years = Math.max(p.years||0, 3); p.morale = 65; p.unsettled = null; p.requested = false; p.worried = false; p.rebuffs = 0;
  if (from.players.length<14 && !isHuman(state, from.id)) youthFill(state, from, 14);
}
function humanListings(state){
  const out = [];
  for (const m of activeManagers(state)){ if (m.userClub===state.userClub) continue; for (const id of state.clubs[m.userClub].players){ const p = state.players[id]; if (p.listed!==null) out.push({p, m}); } }
  return out;
}
function removePlayer(state, p, from){ from.players = from.players.filter(id=>id!==p.id); p.club = -1; }

// ---------- Season end ----------
function prizeFor(div, pos){ const top = CFG.PRIZE_TOP[div], bot = CFG.PRIZE_BOT[div]; return Math.round(top - (top-bot)*(pos-1)/15); }
function youthFill(state, club, target){
  const sq = squadOf(state, club);
  const mean = sq.length? sq.reduce((s,p)=>s+p.skill,0)/sq.length : (club.div===0? club.rating : CFG.DIV_MEAN[club.div]);
  while (club.players.length<target){
    const counts = {GK:0,DEF:0,MID:0,FWD:0}; squadOf(state,club).forEach(p=>counts[p.pos]++);
    const want = counts.GK<2?'GK':counts.DEF<5?'DEF':counts.MID<5?'MID':counts.FWD<4?'FWD':pick(['DEF','MID','FWD']);
    const p = makePlayer(state, want, Math.max(15, rNorm(mean-9, 5)), rInt(17,19), club.id); refreshValues(p); club.players.push(p.id);
    if (isHuman(state, club.id)) newsTo(state, club.id, `${p.name}, ${p.age}, promoted from the youth team.`, 'info');
  }
}
function emergencyFill(state, club){
  // a human squad under 14: promote the best reserves, then the youth team patch the rest
  const rs = reservesOf(state, club).sort((a,b)=>b.skill-a.skill);
  while (club.players.length<16 && rs.length){ const p = rs.shift(); p.reserve = false; club.reserves = club.reserves.filter(id=>id!==p.id); club.players.push(p.id); p.wage = Math.max(60, Math.round(wageFor(p.skill)*0.7/5)*5); p.years = 3; newsTo(state, club.id, `${p.name} promoted from the youth team to make up the numbers.`, 'warn'); }
  if (club.players.length<16) youthFill(state, club, 16);
}
function developPlayers(state){
  for (const c of state.clubs){
    for (const p of squadOf(state,c)){
      p.age++;
      let d;
      if (p.age<=27){ const room = p.pot - p.skill; d = room>0? Math.min(room, rInt(0,1) + Math.round(room/10)) : rInt(-1,0); }
      else if (p.age<=30) d = rInt(-2,1); else d = rInt(-6,-2);
      p.skill = clamp(p.skill+d, 10, 99);
      if (p.age>=28) p.pot = p.skill;
      p.fitness = 100; p.injury = 0; p.goals = 0; p.apps = 0; p.yellows = 0; p.reds = 0; p.rebuffs = 0;
      if ((p.age>=34 && rand()<0.5) || p.age>=36){ p.retired = true; }
      revalue(p);
    }
    const retired = squadOf(state,c).filter(p=>p.retired);
    for (const p of retired){ removePlayer(state,p,c); if (isHuman(state, c.id)) newsTo(state, c.id, `${p.name} has retired.`, 'info'); }
  }
}
function aiStrengthen(state){
  for (const c of state.clubs){
    if (isHuman(state, c.id)) continue;
    const target = c.div===0? c.rating : CFG.DIV_MEAN[c.div] + (7.5 - (expectedPos(state,c)-1))*CFG.PRESTIGE_SKILL_SPREAD;
    let sq = squadOf(state,c).slice().sort((a,b)=>a.skill-b.skill);
    let mean = sq.reduce((s,p)=>s+p.skill,0)/sq.length;
    if (mean > target+2){
      const n = clamp(Math.ceil((mean-target)/2), 1, 3);
      for (let i=0;i<n;i++){
        const star = sq[sq.length-1-i]; removePlayer(state, star, c);
        const np = makePlayer(state, star.pos, rNorm(target-4, 5), randomAge(), c.id); refreshValues(np); c.players.push(np.id);
      }
    } else if (mean < target-1){
      const n = clamp(Math.ceil((target-mean)/1.2), 1, 8);
      for (let i=0;i<n && i<sq.length;i++){
        const old = sq[i]; removePlayer(state, old, c);
        const np = makePlayer(state, old.pos, rNorm(target+4, 5), randomAge(), c.id); refreshValues(np); c.players.push(np.id);
      }
    }
    youthFill(state, c, 16);
  }
}

        if (down){ credit(st, user, -st.sponsor.clawback, `${st.sponsor.name} clawback`); sm.clawback = st.sponsor.clawback; news(st, `${st.sponsor.name} invoke the relegation clause and take back £${fmt(st.sponsor.clawback)}.`, 'warn'); }

      if (cr.mode==='giant' && cr.seasons===2 && user.div===4) st.gameOver = 'Two seasons in Division 4 is two too many for this club. You have been sacked.';

function nextFixture(state){
  const wk = state.schedule[state.week-1]; const uid = state.userClub;
  if (wk.type==='league'){
    const f = state.fixtures[state.clubs[uid].div][wk.round].find(x=>x.h===uid||x.a===uid);
    return {type:'league', home: f.h===uid, opp: state.clubs[f.h===uid?f.a:f.h]};
  }
  const t = state.cups[wk.cup].ties.find(x=>x.h===uid||x.a===uid);
  if (!t) return {type:'none', cup: wk.cup, round: wk.round};
  return {type:'cup', cup: wk.cup, round: wk.round, home: t.h===uid, opp: state.clubs[t.h===uid?t.a:t.h], neutral: wk.round===5};
}
function buildXI(state, club, selectedIds, formationName){
  const fm = FORMATIONS[formationName||club.formation||'4-4-2'];
  const sel = (selectedIds||[]).map(id=>state.players[id]).filter(p=>p && p.club===club.id && available(p));
  const need = [['GK',1],['DEF',fm.d],['MID',fm.m],['FWD',fm.f]];
  const used = new Set(); const xi = [];
  for (const [slot,n] of need){
    const c = sel.filter(p=>p.pos===slot&&!used.has(p.id)).sort((a,b)=>b.skill-a.skill);
    for (let i=0;i<n&&i<c.length;i++){ used.add(c[i].id); xi.push({p:c[i],slot}); }
  }
  const fill = (pool) => {
    for (const [slot,n] of need){
      let have = xi.filter(x=>x.slot===slot).length; if (have>=n) continue;
      const c = pool.filter(p=>!used.has(p.id)).sort((a,b)=>effSkill(b,slot)-effSkill(a,slot));
      for (const p of c){ if (have>=n) break; used.add(p.id); xi.push({p,slot}); have++; }
    }
  };
  fill(sel);
  if (xi.length<11){
    const rest = squadOf(state,club).filter(p=>available(p) && !used.has(p.id));
    for (const [slot,n] of need){
      let have = xi.filter(x=>x.slot===slot).length; if (have>=n) continue;
      const c = rest.filter(p=>p.pos===slot && !used.has(p.id)).sort((a,b)=>b.skill-a.skill);
      for (const p of c){ if (have>=n) break; used.add(p.id); xi.push({p,slot}); have++; }
    }
    fill(rest);
  }
  return xi;
}

function unlistPlayer(state, pid){ const p = state.players[pid]; if (p) p.listed = null; state.offers = state.offers.filter(o=>o.pid!==pid); }

      const min = e.minute || Math.min(120, Math.floor(e.matchSecond/60)+1);
      switch (e.type){
        case EV.GOAL: return { cls: ours? 'us':'', html: `${min}' GOAL ${C.esc(e.playerName||'')} (${C.esc(team.short)}) ${score.home}-${score.away}` };
        case EV.CARD: return { cls: ours? 'us':'', html: `<span class="dim">${min}'</span> ${e.card==='red'? '<span class="mark">RED CARD</span>' : 'Booked'} ${C.esc(e.playerName||'')} (${C.esc(team.short)})` };
        case EV.HALF_TIME: return { cls:'dim', html: `Half-time ${score.home}-${score.away}` };
        case EV.FULL_TIME: return { cls:'dim', html: C.esc(e.text) };
        case EV.ET_START: return e.matchSecond===5400? { cls:'dim', html:'Extra time' } : null;
        case EV.ET_END: return { cls:'dim', html: `End of extra time ${score.home}-${score.away}` };
        case EV.SHOOTOUT_RESULT: return { cls: ours? 'us':'', html: C.esc(e.text) };
        default: return null;
      }
    };
    let lastBoard = '';
    const board = (s) => {
      const key = s.clock.label+'|'+s.score.home+'|'+s.score.away+'|'+s.phaseLabel;
      if (key===lastBoard) return; lastBoard = key;
      const sc = C.$('#md-score'); if (sc) sc.textContent = s.score.home+' - '+s.score.away;
      const ck = C.$('#md-clock'); if (ck) ck.textContent = s.clock.label+(s.clock.extraTime? ' ET' : '')+'  '+s.phaseLabel;
    };
    v.playback = MD.createPlayback(pres, {
      onFrame: (sec, state) => {
        const now = (root.performance && root.performance.now)? root.performance.now() : Date.now();
        if (v.reduced && now - v.lastDraw < 200 && !state.ended) return;
        v.lastDraw = now;
        const s = scene.getSceneAt(state.sceneSecond===undefined? sec : state.sceneSecond);   // the picture
        if (v.renderer) v.renderer.render(s, { fastForward: state.fastForward, speed: state.speed, reducedMotion: v.reduced, sinceCut: state.sinceCut });
        board(scene.getSceneAt(sec));                                                           // the clock and score
      },
      onEvent: (e) => {
        if (e.text && comm){ comm.textContent = e.text; }
        const s = scene.getSceneAt(e.matchSecond);
        const line = lineFor(e, s.score);
        if (line && log){ log.insertAdjacentHTML('beforeend', `<div class="${line.cls}">${line.html}</div>`); log.scrollTop = log.scrollHeight; }
        if (e.type===EV.GOAL) MD.audio.goal();
        else if (e.type===EV.KICK_OFF || e.type===EV.SECOND_HALF || e.type===EV.ET_START) MD.audio.whistle('start');
        else if (e.type===EV.HALF_TIME || e.type===EV.ET_HALF || e.type===EV.ET_END) MD.audio.whistle('half');
        else if (e.type===EV.FULL_TIME) MD.audio.whistle('end');
        else if (e.type===EV.SHOT_SAVED || e.type===EV.SHOT_WIDE) MD.audio.chance();
      },
      onState: (state) => { const b = C.$('#md-play'); if (b) b.textContent = state.playing? 'Pause' : (state.ended? 'Ended' : 'Play'); for (const x of [1,2,4]){ const sb = C.$('#md-speed-'+x); if (sb) sb.classList.toggle('on', state.speed===x); } },
      onEnd: () => { v.done = true; MD.audio.stop(); const act = C.$('#act'); if (act) act.innerHTML = `<button class="b" data-a="md-fulltime">Full time</button>`; },
    });
    MD.audio.start();
    v.playback.play();
    if (C.Track) C.Track.send('match_watched', { competition: pres.competition.kind, extra: pres.official.extra||'none', view: getView(), reduced_motion: v.reduced });
    return v;
  }
  function mountRenderer(id){
    const v = C.S.md && C.S.md.viewer; if (!v) return;
    const stage = C.$('#md-stage'); if (!stage) return;
    if (v.renderer){ try { v.renderer.dispose(); } catch(e){} v.renderer = null; }
    const def = MD.renderers[id] || MD.renderers.canvas2d;
    v.renderer = def.create({});
    v.renderer.mount(stage, v.pres);
    const state = v.playback? v.playback.state() : { matchSecond:0, fastForward:false, speed:1 };
    v.renderer.render(v.scene.getSceneAt(state.matchSecond), { fastForward: state.fastForward, speed: state.speed, reducedMotion: v.reduced });
    const vb = C.$('#md-view'); if (vb) vb.textContent = 'View: '+def.name;
  }
  function closeViewer(){
    const S = C.S; const v = S.md && S.md.viewer; if (!v) return;
    try { if (v.playback) v.playback.dispose(); } catch(e){}
    try { if (v.renderer) v.renderer.dispose(); } catch(e){}
    MD.audio.stop();
    S.md.viewer = null;
  }

  // ---------- screens ----------
  function screens(){
    const S = C.S, E = C.E, esc = C.esc;
    return {
      matchpick(){
        const st = S.state, u = C.user(); const q = S.md.queue[0]; const m = q.m;
        const us = m.home.id===u.id;
        const where = m.euro && m.euro.final? 'Neutral ground' : m.neutral? 'Neutral ground' : us? 'At home' : 'Away';
        const reduced = reducedMotion();
        return { main: `<h1>Matchday</h1><p class="dim">${compLabel(m, S.results.week)}. ${where}.</p>
          <div class="md-tie"><span class="${us?'hot':''}">${esc(m.home.name)}</span><br><span class="dim" style="font-size:14px">v</span><br><span class="${!us?'hot':''}">${esc(m.away.name)}</span></div>
          <button class="b" data-a="md-watch">Watch the match<br><span class="dim">About a minute and a half${reduced? ', with reduced motion' : ''}. Skip to the result at any time.</span></button>
          <button class="b" data-a="md-instant">Instant result</button>
          ${C.multi()? `<p class="dim">${esc(C.mgr().managerName)}'s game. Nobody else's result is shown until everyone has had their turn.</p>` : ''}` };
      },
      matchview(){
        const v = S.md.viewer; const p = v.pres; const u = C.user();
        const usH = p.teams.home.clubId===u.id;
        const sound = MD.audio.enabled;
        return { main: `<div class="md-board"><span class="t ${usH?'hot':''}">${esc(p.teams.home.short)}</span><span class="s" id="md-score" aria-live="polite">0 - 0</span><span class="t a ${!usH?'hot':''}">${esc(p.teams.away.short)}</span></div>

          action: `<div class="md-controls"><button class="b" data-a="md-play" id="md-play" aria-label="Play or pause">Pause</button><button class="b quiet on" data-a="md-speed" data-s="1" id="md-speed-1" aria-label="Normal speed">1x</button><button class="b quiet" data-a="md-speed" data-s="2" id="md-speed-2" aria-label="Double speed">2x</button><button class="b quiet" data-a="md-speed" data-s="4" id="md-speed-4" aria-label="Four times speed">4x</button><button class="b quiet" data-a="md-skip">Skip</button></div>` };
      },
      matchresult(){
        const m = S.md.current; const u = C.user(); const us = m.home.id===u.id;
        const res = m.gH===m.gA && !m.extra? 'Draw' : (m.gH>m.gA || m.extra==='pens-H')===us? 'Win' : 'Defeat';
        const title = m.euro? (m.winner!==undefined? (m.winner===u.id? 'Through' : 'Out') : res) : res;
        const scorers = m.scorers.map(s=>`<div class="${(s.side==='H')===us?'us':''}">${s.min}' GOAL ${esc(s.p.name)} (${esc(s.side==='H'?m.home.short:m.away.short)})${s.et? ' <span class="dim">aet</span>' : ''}</div>`).join('');

        const agg = m.agg? `<div class="dim">Aggregate ${us? (m.home.id===u.id? `${m.agg.b}-${m.agg.a}` : `${m.agg.a}-${m.agg.b}`) : `${m.agg.b}-${m.agg.a}`}.</div>` : '';
        const reds = (m.cards||[]).filter(c=>c.type==='R').map(c=>`<div class="${(c.side==='H')===us?'us':''}"><span class="mark">Sent off:</span> ${esc(c.p.name)} ${c.min}'</div>`).join('');
        const yellows = (m.cards||[]).filter(c=>c.type==='Y'); const booked = yellows.length? `<div class="dim">Booked: ${yellows.map(c=>esc(c.p.name)).join(', ')}</div>` : '';
        const inj = m.injuries.filter(p=>p.club===u.id);
        return { main: `<p class="dim" style="text-align:center">${compLabel(m, S.results.week)}</p>
          <div class="clock">${title}</div>
          <div class="score"><span class="${us?'hot':''}">${esc(m.home.short)}</span> ${m.gH} - ${m.gA} <span class="${!us?'hot':''}">${esc(m.away.short)}</span><small>Attendance ${E.fmt(m.att)}</small></div>
          <div class="events">${scorers||'<div class="dim">No goals.</div>'}${extra}${agg}${reds}${booked}${inj.length? `<div class="hot">Injured: ${inj.map(p=>esc(p.name)+' ('+p.injury+' wk)').join(', ')}</div>`:''}</div>`,
          action: `<button class="b" data-a="md-continue">Continue</button>` };
      },
    };
  }

  // ---------- actions ----------
  async function act(a, d){
    const S = C.S;
    const v = S.md && S.md.viewer;
    switch (a){
      case 'md-watch': { const q = S.md.queue[0]; const ok = openViewer(q.m); if (!ok){ C.toast('Could not build the match view. Showing the result.'); S.md.current = S.md.queue.shift().m; C.go('matchresult'); } break; }
      case 'md-instant': { S.md.current = S.md.queue.shift().m; if (C.Track) C.Track.send('match_instant', {}); C.go('matchresult'); break; }
      case 'md-fulltime': { closeViewer(); S.md.current = S.md.queue.shift().m; C.go('matchresult'); break; }
      case 'md-continue': nextMatch(); break;
      case 'md-play': if (v && v.playback && !v.done) v.playback.toggle(); break;
      case 'md-speed': if (v && v.playback) v.playback.setSpeed(+d.s); break;
      case 'md-skip': if (v && v.playback && !v.done) v.playback.skip(); break;
      case 'md-sound': { MD.audio.setEnabled(!MD.audio.enabled); const b = C.$('#md-sound'); if (b){ b.textContent = 'Sound: '+(MD.audio.enabled? 'on' : 'off'); b.setAttribute('aria-pressed', String(MD.audio.enabled)); } if (MD.audio.enabled && v && !v.done) MD.audio.start(); break; }
      case 'md-view': { const ids = Object.keys(MD.renderers).filter(k=>k!=='common'); const cur = getView(); const next = ids[(ids.indexOf(cur)+1)%ids.length]; setView(next); mountRenderer(next); break; }
    }
  }
  function onKey(e){
    const S = C.S; if (S.screen!=='matchview' || !S.md || !S.md.viewer) return;
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key===' '){ e.preventDefault(); act('md-play', {}); }
    else if (e.key==='s' || e.key==='S') act('md-skip', {});
    else if (e.key==='1' || e.key==='2' || e.key==='4') act('md-speed', { s: e.key });
  }

  function install(ctx){
    C = ctx;
    Object.assign(C.SCREENS, screens());
    root.document.addEventListener('keydown', onKey);
  }

  MD.ui = { install, startWeek, afterPass, act, closeViewer, mountRenderer, getView, compLabel, matchesFor };
})(typeof window!=='undefined'? window : globalThis);

</script>
<script>
(function(){

const Pack = {
  async pack(str){ try{ if (typeof CompressionStream==='undefined' || str.length<20000) return str; const cs = new CompressionStream('gzip'); const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close(); const buf = await new Response(cs.readable).arrayBuffer(); let bin=''; const bytes = new Uint8Array(buf); for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return 'gz:'+btoa(bin); }catch(e){ return str; } },

    const packed = (k===SAVE_KEY || k.startsWith('sm91-slot-'))? await Pack.pack(v) : v;
    if (window.storage && window.storage.set){ try{ await window.storage.set(k, packed, false); return; }catch(e){} }
    try{ localStorage.setItem(k,packed); return; }catch(e){ mem[k]=v; }
  },
  async del(k){
    if (window.storage && window.storage.delete){ try{ await window.storage.delete(k, false); return; }catch(e){} }
    try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; }
  }
};
function serialize(state){
  const copy = Object.assign({}, state, { lastResults: null, lastWeek: null, v: E.SAVE_VERSION, app: APP_VERSION });
  copy.clubs = state.clubs.map(c=>Object.assign({}, c, { xi: null }));
  return JSON.stringify(copy);
}
async function save(){ if (!S.state) return; try{ E.saveCurrent(S.state); await Store.set(SAVE_KEY, serialize(S.state)); }catch(e){} }
const SLOT_INDEX = 'sm91-slots';
async function listSlots(){ try{ const raw = await Store.get(SLOT_INDEX); return raw? JSON.parse(raw) : []; }catch(e){ return []; } }
async function saveSlot(name){
  const st = S.state; E.saveCurrent(st);
  const slots = await listSlots(); const id = Date.now(); const key = 'sm91-slot-'+id;
  await Store.set(key, serialize(st));
  slots.unshift({ id, key, name, club: user().name, manager: st.managerName, managers: E.activeManagers(st).length, season: st.season, week: st.week, ts: id });
  while (slots.length>8){ const drop = slots.pop(); await Store.del(drop.key); }
  await Store.set(SLOT_INDEX, JSON.stringify(slots));
  return slots;
}
async function loadSlot(id){
  const slots = await listSlots(); const s = slots.find(x=>x.id===id); if (!s) return 'That save has gone.';
  const raw = await Store.get(s.key); if (!raw) return 'That save is empty.';
  S.state = E.restore(JSON.parse(raw)); S.hasSave = true; S.pendingReview = false; S.results = null; S.tab.report = null;
  await save(); return null;
}
async function deleteSlot(id){ const slots = await listSlots(); const s = slots.find(x=>x.id===id); if (s) await Store.del(s.key); await Store.set(SLOT_INDEX, JSON.stringify(slots.filter(x=>x.id!==id))); }
function multi(){ return S.state && E.activeManagers(S.state).length>1; }
function mgr(){ return S.state.managers[S.state.cur]; }
async function load(){ try{ const raw = await Store.get(SAVE_KEY); if (!raw) return null; const st = JSON.parse(raw); return E.restore(st); }catch(e){ return null; } }

  help(){

    return { main: `<h1>How to play</h1>
      <p>You've been handed a Division 4 club and a modest bank balance. Get promoted, win cups, get to Europe, don't go bust. Each week you pick a team, do your business, then play the match.</p>
      <h2>The week</h2><p>Home shows this week's fixture, the board's mood and the news. Squad is where you pick the XI, set a formation and choose how hard to train. Play the match from Home. On cup weeks you might have no game, which is a good week for hard training.</p>
      <h2>Money</h2><p>Gates, sponsorship and television money in; wages, staff and ground upkeep out. Summer wages land in one lump at the season review. The overdraft limit is half your turnover; eight weeks past it and the bank has you sacked. Loans are separate and cheaper than the overdraft. Cash in the bank earns interest.</p>
      <h2>Pre-season</h2><p>Each season starts with a sponsor to choose (safe money, per-win money, or a bigger cheque with a relegation clause) and a season ticket price. Cheap season tickets bring cash now but most of those fans would have paid on the gate anyway.</p>
      <h2>Players</h2><p>Skill is what he is now; the ▲ is how far he could go, and you only see that with a scout. Players improve in training until about 30 (faster with a better coach), then decline. Fitness under 70 doubles the injury risk.</p>
      <h2>Contracts</h2><p>Every player is on a deal of one to four years at a fixed wage. Renew early and you lock a cheap wage before he improves; leave it late and he asks for what he is worth now. Players in their last year start to worry from week 20. If you do nothing, your assistant re-signs them at about 10% over the odds, provided they are happy to stay; the ones who are not leave for nothing. Out-of-contract players from every club appear under Free in the market each summer. You can release a player at any time by paying off half his remaining contract.</p>
      <h2>Mood</h2><p>Playing, winning and a fair wage keep a player happy; sitting on the bench, losing, being listed for sale, or a bigger club sniffing around do the opposite. Unhappy players play a little worse and eventually ask for a transfer, and a player who has asked to leave will not talk about a new deal until he cheers up.</p>
      <h2>Bookings</h2><p>Five yellow cards in a season is a one-match ban, ten is two, a red card is one to three. Bans apply to the next game in any competition and the squad screen shows who is one booking away.</p>
      <h2>Youth</h2><p>The academy (Club, Youth) brings in prospects each summer: more of them with a better grade, better ones with a good youth coach. They sit in the youth team on tiny wages until you promote them, which signs them to a cheap three-year deal. Nobody stays past 21.</p>
      <h2>The market</h2><p>The weekly list is other clubs' fringe players at fair prices. The scout will search on a brief (position, age, skill, price) or you can browse any club and bid for anyone; clubs want well over the value and won't sell someone they just signed. List your own players and offers arrive over the following weeks. European clubs will come for your best player once you're in Division 3.</p>
      <h2>Staff and ground</h2><p>Coach speeds up training, physio shortens injuries, scout widens the search and reveals potential. Ground safety falls slowly; let it slide and you'll get crowd trouble and fines. Build a stand only when the Ground tab says you're turning people away. Set your own ticket price there too.</p>
      <h2>Cups and Europe</h2><p>League Cup in the first half of the season, FA Cup in the second, both straight knockout. Win the league for the European Cup, the FA Cup for the Cup Winners' Cup, or finish second or third for the UEFA Cup. European ties are two legs midweek on top of the league, with their own XI.</p>
      <h2>Records and the hall of fame</h2><p>Records (from the Table screen) keeps your club's record win, gate and fees, all-time scorers and the roll of honour, and your own career points: trophies and promotions weighted by how hard they are. The hall of fame keeps every career from every game on this phone${LADDER_URL? ', and the ladder compares you with everyone else playing' : ''}.</p>
      <h2>Challenge starts</h2><p>Besides the classic random Division 4 start: Skint (deep in the overdraft, twelve weeks to fix it), Relegation scrap (bottom of Division 1 at Christmas), Fallen giant (a famous club down in Division 4 with a wage bill to match) and Big job (the biggest club, title expected in year one). Only classic starts count on the "fastest" ladders.</p>
      <h2>Several managers</h2><p>Up to eight on one phone, passing it round each week. You can bid for each other's players (they decide on their turn), rename each other's rivals, and the managers' table settles who's winning.</p>
      <h2>Saves</h2><p>The game autosaves every week. Saves on the home screen keeps named copies you can load later, for instance before a cup final.</p>
      ${LADDER_URL? `<h2>The ladder</h2><p>At each season end the game posts your nickname, career points and a few career facts (clubs, trophies, seasons) to a shared ladder so you can see how you compare. No account and nothing from your save beyond that. <button class="b" data-a="ladderopt" style="margin-top:8px">${ladderOn()? 'Posting to the ladder: on (tap to turn off)' : 'Posting to the ladder: off (tap to turn on)'}</button></p>` : ''}
      <h2>Usage counts</h2><p>To see whether anyone plays past the first week, the game sends a handful of anonymous counts (game started, weeks 1 and 5 reached, season finished) with a random id. No names, no club names, nothing from your save. ${ANALYTICS_TOKEN? `<button class="b" data-a="analytics" style="margin-top:8px">${analyticsOn()? 'Sending counts: on (tap to turn off)' : 'Sending counts: off (tap to turn on)'}</button><button class="b" data-a="pingtest">Send a test ping</button>${S.pingResult? `<span class="dim">${esc(S.pingResult)}</span>`:''}` : '<span class="dim">Not active in this build.</span>'}</p>`,

  home(){
    const st = S.state, u = user();

    let fix;
    if (nf.type==='none') fix = `<p>No match this week. You're out of the ${E.CFG.CUPS[nf.cup].name}, so the ground stays quiet. A good week for hard training.</p>`;
    else {
      const comp = nf.type==='cup'? `${E.CFG.CUPS[nf.cup].name} ${E.CUP_ROUND_NAMES[nf.round]}` : 'League';
      const where = nf.neutral? 'at a neutral ground' : nf.home? 'at home' : 'away';
      fix = `<p>${comp}: <span class="hot">${esc(nf.opp.name)}</span> ${where}<br><span class="dim">Division ${nf.opp.div}, ${nf.opp.div===u.div? 'currently '+ordinal(nf.opp.leaguePos) : 'a '+(nf.opp.div<u.div?'bigger':'smaller')+' club'}</span></p>`;
    }
    const es = E.euroSlot(st.week); const et = inEurope(u)? E.euroTieFor(st, u.id) : null;
    const euroLine = (es && et && ((es.final && et.final) || (!es.final && !et.final && et.round===es.slot)))? `<p>Also this week: <span class="hot">${fmtEuroTie(et)}</span>. Two games in a week; pick your European XI on the Squad screen.</p>` : '';
    const table = E.tableFor(st,u.div);
    const pos = st.week>1? `${ordinal(u.leaguePos)} in Division ${u.div}, ${u.st.pts} pts from ${u.st.p}` : `Season ${st.season}, pre-season`;
    const news = st.news.filter(n=>n.s===st.season || st.week<=2).slice(0,8);

    const firstSeason = st.season===1;

    const updNote = seenVersion()!==APP_VERSION? `<p class="hot">Updated to ${APP_VERSION}. <button class="b small" data-a="whatsnew" style="display:inline;width:auto">See what's new</button></p>` : '';
    return { main: `<h1>This week</h1>${updNote}${preLine}${fix}${euroLine}
      <div class="kv"><span>League</span><span>${pos}</span></div>
      <div class="kv"><span>Board</span><span>${E.boardMood(u.confidence)}, expect ${ordinal(exp)}</span></div>
      <div class="kv"><span>League Cup</span><span>${cupStatus(u,'lc')}</span></div>
      <div class="kv"><span>FA Cup</span><span>${cupStatus(u,'fa')}</span></div>
      ${u.euro? `<div class="kv"><span>${euroComp(u.euro.comp).short}</span><span>${euroStatusText(u)}</span></div>` : ''}
      ${st.sponsor? `<div class="kv"><span>Sponsor</span><span>${esc(st.sponsor.name)}</span></div>`:''}
      <div class="kv"><span>Selected</span><span>${selectionSummary()}</span></div>
      ${u.build? `<div class="kv"><span>Builders</span><span>${E.fmt(u.build.seats)} seats, ${u.build.weeksLeft} wk to go</span></div>`:''}
      ${u.safety<E.CFG.CROWD_TROUBLE_BELOW? `<div class="kv"><span>Ground</span><span class="hot">${u.safety<E.CFG.SAFETY_RESTRICT_BELOW?'capacity restricted':'crowd trouble risk'}</span></div>`:''}
      ${st.jobOffer!==null? jobOfferPanel() : ''}
      <div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-top:12px"><button class="b" data-a="fixtures" style="padding:12px 4px;text-align:center">Fixtures</button><button class="b" data-a="results" style="padding:12px 4px;text-align:center">Results</button><button class="b" data-a="saves" style="padding:12px 4px;text-align:center">Saves</button><button class="b ${S.confirmResign?'on':''}" data-a="resign" style="padding:12px 4px;text-align:center">${S.confirmResign?'Really?':'Resign'}</button></div>
      <h2>News</h2>${news.length? `<ul class="news">${news.map(n=>`<li class="${n.kind==='warn'?'warn':''}"><span class="dim">Wk ${n.w}</span> ${esc(n.text)}</li>`).join('')}</ul>` : '<p class="dim">Nothing yet.</p>'}
      <p class="dim" style="margin-top:14px">Manager: ${esc(st.managerName)}. <button class="b small" data-a="help" style="display:inline;width:auto;margin-top:6px">How to play</button> ${FEEDBACK_URL? `<a class="b small" data-track="feedback_opened" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener" style="display:inline;width:auto;margin-top:6px;text-decoration:none">Send feedback</a> `:''}${multi()? `<button class="b small ${S.confirmRetire?'on':''}" data-a="retire" style="display:inline;width:auto;margin-top:6px">${S.confirmRetire?'Really retire? Tap again':'Retire from the game'}</button>` : `<button class="b small ${S.confirmQuit?'on':''}" data-a="quit" style="display:inline;width:auto;margin-top:6px">${S.confirmQuit?'Really abandon? Tap again':'Abandon this game'}</button>`}</p>`,
      action: (pre && !firstSeason)? `<button class="b" data-a="preseason">Pre-season decisions</button>` : multi()? `<button class="b" data-a="ready">${nf.type==='none'? 'Ready (no game this week)' : 'Ready for kick-off'}</button>` : nf.type==='none'? `<button class="b" data-a="play">Skip to next week</button>` : `<button class="b" data-a="play">Play the match</button>` };
  },
  preseason(){
    const st = S.state, u = user(); const ps = st.preseason;
    if (!ps) return SCREENS.home();
    const typeText = { safe: 'Paid in full now. No strings.', perwin: 'Paid per league win, week by week. Back yourselves.', bold: 'Bigger cheque now, but relegation (or bottom four in Division 4) means paying most of it back.' };
    const sponsor = ps.sponsorDone? `<p>Signed with <span class="hot">${esc(st.sponsor.name)}</span>: ${st.sponsor.type==='perwin'? money(st.sponsor.perWin)+' per league win' : money(st.sponsor.amount)+(st.sponsor.type==='bold'? ', '+money(st.sponsor.clawback)+' back if you go down' : '')}.</p>`
      : ps.offers.map((o,i)=>`<button class="b" data-a="sponsor" data-i="${i}"><span class="hot">${esc(o.name)}</span><br>${o.type==='perwin'? money(o.perWin)+' per win' : money(o.amount)+(o.type==='bold'? ', clawback '+money(o.clawback) : '')}<br><span class="dim">${typeText[o.type]}</span></button>`).join('');
    const tickets = ps.ticketsDone? `<p>${E.fmt(st.seasonTicket.sold)} sold at ${money(st.seasonTicket.price)}, ${money(st.seasonTicket.sold*st.seasonTicket.price)} in the bank.</p>`
      : `<p class="dim">Match tickets are £${E.ticketOf(u)} (change that on the Ground tab first if you want to). Holders get all 15 home league games. Cheap tickets bring cash now but most of those fans would have paid on the gate anyway.</p>` +
        [8,10,12,15].map(m=>{ const f = E.seasonTicketForecast(st,u,m); return `<button class="b" data-a="tickets" data-m="${m}">£${f.price} <span class="dim">(${m} games' worth)</span><br><span class="dim">about ${E.fmt(f.sold)} sold, ${money(f.income)} now</span></button>`; }).join('');

  },
  squad(){
    const st = S.state, u = user();
    if (!inEurope(u)) S.xiMode = 'league';
    const euroMode = S.xiMode==='euro';
    const ids = sel();
    const fmName = euroMode? (u.euroFormation||u.formation) : u.formation;
    const xi = E.buildXI(st, u, ids, fmName);
    const slotOf = {}; xi.forEach(x=>slotOf[x.p.id]=x.slot);
    const str = E.teamStrength(xi);
    const sq = E.squadOf(st,u).slice().sort((a,b)=>posOrder(a.pos)-posOrder(b.pos)||b.skill-a.skill);
    const fms = Object.keys(E.FORMATIONS);
    const rows = sq.map(p=>{
      const on = ids.includes(p.id) && p.injury===0;
      const inXI = slotOf[p.id];
      const oop = inXI && inXI!==p.pos? `<span class="mark">@${inXI}</span>` : '';
      const tags = [`${p.years<=1? '<span class="mark">expires</span>' : p.years+'y'}`, moodTag(p), p.yellows>=4? `<span class="mark">${p.yellows}Y</span>` : p.yellows? p.yellows+'Y' : ''].filter(Boolean).join(' · ');
      return `<tr class="tap ${on?'sel':''}" data-a="toggle" data-id="${p.id}"><td>${on?'<span class="mark">■</span>':'□'}</td><td>${p.pos}</td><td class="wrap">${esc(p.name)} ${oop}${p.listed!==null?'<span class="pill">sale</span>':''}${p.requested?'<span class="pill">wants out</span>':''}<br><span class="dim" style="font-size:12px">${tags}</span></td><td class="n">${p.skill}${potTag(p)}</td><td class="n">${p.age}</td><td class="n">${p.ban>0? `<span class="mark">ban ${p.ban}</span>` : p.injury>0?`<span class="mark">inj ${p.injury}</span>`:p.fitness}</td><td><button class="b small" data-a="player" data-id="${p.id}">›</button></td></tr>`;
    }).join('');
    const modeBar = inEurope(u)? `<div class="grid2"><button class="b ${!euroMode?'on':''}" data-a="ximode" data-m="league">League XI</button><button class="b ${euroMode?'on':''}" data-a="ximode" data-m="euro">European XI</button></div><p class="dim">${euroMode? 'This side plays your '+euroComp(u.euro.comp).name+' ties. Leave it empty and the league XI is used.' : 'This side plays league and domestic cup games.'}</p>` : '';
    return { main: `<h1>Squad and tactics</h1>${modeBar}
      <div class="grid3">${fms.map(f=>`<button class="b ${fmName===f?'on':''}" data-a="formation" data-f="${f}">${f}</button>`).join('')}</div>
      <div class="row"><button class="b" data-a="autopick">Pick the best XI</button><button class="b" data-a="clearpick">Clear</button></div>
      <p class="dim" style="margin:12px 0 6px">Training this week</p>
      <div class="grid3">${['light','normal','hard'].map(k=>`<button class="b ${u.training===k?'on':''}" data-a="training" data-t="${k}">${{light:'Light',normal:'Normal',hard:'Hard'}[k]}</button>`).join('')}</div>
      <p class="dim">${{light:'Rest and recover. Fitness comes back faster, nobody improves much.',normal:'A normal week. Younger players edge forward if the coach is any good.',hard:'Push them. Faster improvement, tired legs and the odd training knock.'}[u.training]} ${u.staff.scout>=1?'':'Hire a scout to see who has room to improve.'}</p>
      <p class="dim">Team: defence ${Math.round(str.defEff)}, midfield ${Math.round(str.mid)}, attack ${Math.round(str.att)}. ${xi.length}/11 picked${ids.length>11?', extras sit out':''}.</p>
      <table><tr><th></th><th>Pos</th><th>Player</th><th class="n">Sk</th><th class="n">Age</th><th class="n">Fit</th><th></th></tr>${rows}</table>
      <p class="dim" style="margin-top:10px">Tap a row to pick or drop. ■ picked, @ playing out of position. Fitness under 70 doubles the injury risk. Five bookings is a one-match ban, ten is two. Contract years and mood under each name.</p>` };
  },
  player(){
    const st = S.state, u = user(), p = st.players[S.pid];
    if (!p) return SCREENS.squad();
    const mine = p.club===u.id;
    const club = st.clubs[p.club];
    if (p.club===-2) return freeAgentPage(p);
    if (p.reserve && mine) return reservePage(p);
    if (!club) return { main: `<h1>${esc(p.name)}</h1><p class="dim">He has left the league.</p>`, action: `<button class="b quiet" data-a="back">Back</button>` };
    const on = sel().includes(p.id);
    let actions = '';
    if (mine){
      actions = `<button class="b" data-a="toggle" data-id="${p.id}" data-back="1">${on?'Drop from the XI':'Pick for the XI'}</button>`;
      if (p.listed===null) actions += `<h2>Put up for sale</h2><p class="dim">Valued at ${money(p.value)}. Cheaper sells faster.</p><div class="grid3">
        <button class="b" data-a="setamt" data-amt="${Math.round(p.value*0.8/500)*500}">Quick<br><span class="dim">${money(Math.round(p.value*0.8/500)*500)}</span></button>
        <button class="b" data-a="setamt" data-amt="${p.value}">Fair<br><span class="dim">${money(p.value)}</span></button>
        <button class="b" data-a="setamt" data-amt="${Math.round(p.value*1.3/500)*500}">Dear<br><span class="dim">${money(Math.round(p.value*1.3/500)*500)}</span></button></div>
        <input id="amt" inputmode="numeric" value="${p.value}" autocomplete="off"><button class="b" data-a="list" data-id="${p.id}">List him at this price</button>`;
      else actions += `<p>Listed at ${money(p.listed)}. Offers arrive over the coming weeks.</p><button class="b" data-a="unlist" data-id="${p.id}">Take off the market</button>`;
      actions += contractPanel(p);
      actions += `<h2>Rename</h2><input id="pname" maxlength="24" value="${esc(p.name)}" autocomplete="off"><button class="b" data-a="renameplayer" data-id="${p.id}">Change his name</button>`;
    } else {
      const fair = Math.round(p.value*1.3/500)*500, gen = Math.round(p.value*1.65/500)*500;
      const tl = st.transferList.find(t=>t.pid===p.id);
      const rival = E.managerOf(st, p.club);
      if (rival){
        const ask = p.listed!==null? p.listed : null;
        const start = ask!==null? ask : p.value;
        actions = `<h2>Bid for ${esc(rival.managerName)}'s player</h2><p class="dim">${ask!==null? `Listed at ${money(ask)}. ` : ''}Valued at ${money(p.value)}. ${esc(rival.managerName)} decides on their turn and the money moves when they accept. Bid whatever you like; it's between the two of you.</p>
          <div class="grid3">${[Math.round(p.value*0.5/500)*500, start, Math.round(p.value*1.5/500)*500].map(a=>`<button class="b" data-a="setamt" data-amt="${a}">${money(a)}</button>`).join('')}</div>
          <input id="amt" inputmode="numeric" value="${start}" autocomplete="off"><button class="b" data-a="bid" data-id="${p.id}">Send the bid</button>`;
      } else
      actions = (tl? `<button class="b" data-a="buy" data-id="${p.id}" data-back="1">Sign him for ${money(tl.price)}</button>` : '') + `<h2>${tl?'Or haggle':'Make a bid'}</h2><p class="dim">${esc(club.name)} value him at ${money(p.value)}. Clubs rarely sell for less than that, and they hate selling at all. Around ${money(fair)} might work; ${money(gen)} is hard to refuse.</p>
        <div class="grid3">${[p.value, fair, gen].map(a=>`<button class="b" data-a="setamt" data-amt="${a}">${money(a)}</button>`).join('')}</div>
        <input id="amt" inputmode="numeric" value="${fair}" autocomplete="off"><button class="b" data-a="bid" data-id="${p.id}">Bid this amount</button>`;
    }
    return { main: `<h1>${esc(p.name)}</h1>
      <div class="kv"><span>Club</span><span>${esc(club? club.name : 'Abroad')}${club && club.div===0? ' <span class="dim">(Europe)</span>':''}</span></div>
      <div class="kv"><span>Position</span><span>${p.pos}</span></div>
      <div class="kv"><span>Skill</span><span>${p.skill}${potTag(p)}</span></div>
      ${E.canSeePot(st,p)? `<div class="kv"><span>Potential</span><span>${p.pot>p.skill? `could reach ${p.pot}` : p.age>=30? 'past his best' : 'as good as he gets'}</span></div>` : ''}
      <div class="kv"><span>Age</span><span>${p.age}</span></div>
      <div class="kv"><span>Fitness</span><span>${p.injury>0? `injured, ${p.injury} wk` : p.fitness}</span></div>
      ${mine? `<div class="kv"><span>Mood</span><span>${E.moraleWord(p.morale||60)}${p.requested? ', has asked to leave' : p.unsettled? ', unsettled by '+esc(p.unsettled.club) : ''}</span></div>` : ''}

      <div class="kv"><span>Wage</span><span>${money(p.wage)} a week</span></div>
      <div class="kv"><span>Contract</span><span>${p.years<=1? '<span class="hot">expires this summer</span>' : p.years+' years left'}</span></div>
      <div class="kv"><span>Value</span><span>${money(p.value)}</span></div>
      <div class="kv"><span>This season</span><span>${p.apps} apps, ${p.goals} goals</span></div>
      ${p.signedS!==undefined? `<div class="kv"><span>Signed</span><span>season ${p.signedS}, week ${p.signedW}${p.paid? ' for '+money(p.paid) : ''}</span></div>` : ''}
      <div style="height:12px"></div>${actions}`,
      action: `<button class="b quiet" data-a="back">Back</button>` };
  },

          (div===0 && u.staff.scout<2? `<p class="dim">Your scout doesn't have the contacts abroad. Hire a good one.</p>` :
          E.divClubs(st,div).filter(c=>c.id!==u.id).sort((a,b)=>div===0? b.rating-a.rating : a.name.localeCompare(b.name)).map(c=>{ const hm = E.managerOf(st,c.id); return `<button class="b" data-a="scoutclub" data-c="${c.id}">${esc(c.name)}${div===0? ` <span class="dim">${c.rating}</span>`:''}${hm? ` <span class="dim">(${esc(hm.managerName)})</span>`:''}</button>`; }).join(''));
      } else {

        body = `<button class="b" data-a="scoutback">‹ ${esc(c.name)}, ${c.div? 'Division '+c.div : 'Europe'}</button><table><tr><th>Pos</th><th>Player</th><th class="n">Sk</th><th class="n">Age</th><th class="n">Value</th></tr>`+
          sq.map(p=>`<tr class="tap" data-a="player" data-id="${p.id}"><td>${p.pos}</td><td class="wrap">${esc(p.name)}</td><td class="n">${p.skill}${potTag(p)}</td><td class="n">${p.age}</td><td class="n">${money(p.value)}</td></tr>`).join('')+`</table>`;

    return { main: `<h1>Finances</h1>
      <div class="kv"><span>Balance</span><span class="${u.balance<0?'hot':''}">${money(u.balance)}</span></div>
      <div class="kv"><span>Overdraft limit</span><span>${money(E.overdraftLimit(st, u))}</span></div>
      <div class="kv"><span>Turnover</span><span>about ${money(Math.round(E.turnover(st,u)/1000)*1000)} a season</span></div>
      <div class="kv"><span>Player wages</span><span>${money(wages)} a week</span></div>
      <div class="kv"><span>Staff wages</span><span>${money(E.staffWages(u))} a week</span></div>

      <div class="kv"><span>Ground upkeep</span><span>${money(ground)} a week</span></div>
      <div class="kv"><span>Ground</span><span>${E.fmt(u.capacity)} capacity</span></div>
      <div class="kv"><span>Ticket price</span><span>£${E.ticketOf(u)} <span class="dim">(set it on the Ground tab)</span></span></div>
      <div class="kv"><span>Sponsor</span><span>${st.sponsor? esc(st.sponsor.name)+(st.sponsor.type==='perwin'? ', '+money(st.sponsor.perWin)+' a win' : st.sponsor.type==='bold'? ', clawback '+money(st.sponsor.clawback) : '') : 'not yet signed'}</span></div>
      <div class="kv"><span>Season tickets</span><span>${st.seasonTicket? E.fmt(st.seasonTicket.sold)+' at £'+st.seasonTicket.price : 'not yet on sale'}</span></div>
      <h2>Bank loan</h2>
      ${st.loan? `<p>${money(st.loan.amount)} borrowed, ${money(st.loan.weekly)} a week, ${st.loan.weeksLeft} payments left.</p><button class="b" data-a="repay">Settle it now for ${money(Math.round(st.loan.weekly*st.loan.weeksLeft*0.95/500)*500)}</button>`
        : `<p class="dim">Up to ${money(E.loanMax(st, u))} at 12%, repaid over 36 weeks. Separate from the overdraft, which is ${money(E.overdraftLimit(st, u))}.</p><div class="grid3">${[0.25,0.5,1].map(f=>{ const mx = E.loanMax(st, u); const a = f===1? mx : Math.floor(mx*f/5000)*5000; return `<button class="b" data-a="loan" data-amt="${a}">${money(a)}<br><span class="dim">${money(Math.round(a*1.12/36))}/wk</span></button>`; }).join('')}</div>`}
      <p class="dim" style="margin-top:10px">Money in the bank earns 0.1% a week (about 5% a year). Anything below zero costs 0.25% a week. Eight weeks past the overdraft limit and the bank pulls the plug. The limit is half your turnover (gates, television and sponsorship), so it grows as the club does.</p>
      <h2>Recent</h2>${ledger.length? ledger.map(l=>`<div class="kv"><span class="dim">Wk ${l.w}</span><span>${esc(l.label)} <span class="${l.amount<0?'':'hot'}">${money(l.amount)}</span></span></div>`).join('') : '<p class="dim">Nothing yet.</p>'}
      ${hist? `<h2>Past seasons</h2>${hist}`:''}` };
  },
  fixtures(){
    const st = S.state, u = user();
    const rows = st.schedule.map((wk,i)=>{
      const w = i+1; const r = st.userResults[w];
      let comp, oppName, where, res = '';
      if (r){
        const opp = st.clubs[r.opp]; comp = r.cup? E.CFG.CUPS[r.cup].short+' '+ROUND_SHORT[r.round] : 'League';
        oppName = opp.short; where = r.home? 'H':'A';
        const won = r.gF>r.gA || (r.extra==='pens-H'&&r.home) || (r.extra==='pens-A'&&!r.home);
        res = `<span class="${won?'hot':''}">${r.gF}-${r.gA}${r.extra?'*':''}</span>`;
        if (r.club!==u.id) oppName += ` <span class="dim">(with ${esc(st.clubs[r.club].short)})</span>`;
      } else if (wk.type==='league'){
        const f = st.fixtures[u.div][wk.round].find(x=>x.h===u.id||x.a===u.id);
        comp = 'League'; oppName = st.clubs[f.h===u.id? f.a : f.h].short; where = f.h===u.id? 'H':'A';
      } else {
        const cup = E.CFG.CUPS[wk.cup]; comp = cup.short+' '+ROUND_SHORT[wk.round];
        const mine = u.cup[wk.cup];
        const t = (!mine.out && wk.round===mine.round)? st.cups[wk.cup].ties.find(x=>x.h===u.id||x.a===u.id) : null;
        if (mine.out){ oppName = '<span class="dim">out</span>'; where=''; }
        else if (t){ oppName = st.clubs[t.h===u.id? t.a : t.h].short; where = wk.round===5? 'N' : t.h===u.id? 'H':'A'; }
        else { oppName = '<span class="dim">if still in</span>'; where=''; }
      }
      let euroRow = '';
      const ue = (st.userEuro||{})[w]; const slot = E.euroSlot(w);
      if (ue){ const won = ue.gF>ue.gA || (ue.extra==='pens-H'&&ue.home) || (ue.extra==='pens-A'&&!ue.home); euroRow = `<tr class="${w===st.week?'me':''}"><td></td><td>${euroComp(ue.comp).short}</td><td class="wrap">${esc(st.clubs[ue.opp].short)}${ue.agg? ` <span class="dim">agg ${ue.agg[0]}-${ue.agg[1]}</span>`:''}</td><td>${ue.final?'N':ue.home?'H':'A'}</td><td class="n"><span class="${won?'hot':''}">${ue.gF}-${ue.gA}${ue.extra?'*':''}</span></td></tr>`; }
      else if (slot && inEurope(u) && w>=st.week){ const et = E.euroTieFor(st, u.id); const mine = (slot.final && et && et.final) || (et && !et.final && !slot.final && et.round===slot.slot); euroRow = `<tr class="${w===st.week?'me':''}"><td></td><td>${euroComp(u.euro.comp).short}</td><td class="wrap">${mine? esc(et.opp.short) : '<span class="dim">if still in</span>'}</td><td>${mine? (slot.final?'N': (slot.leg===1? (et.homeFirst?'H':'A') : (et.homeFirst?'A':'H'))) : ''}</td><td></td></tr>`; }
      return `<tr class="${w===st.week?'me':''}"><td class="n">${w}</td><td>${comp}</td><td class="wrap">${oppName}</td><td>${where}</td><td class="n">${res}</td></tr>${euroRow}`;
    }).join('');
    return { main: `<h1>Season ${st.season} fixtures</h1><table class="tight"><tr><th class="n">Wk</th><th>Comp</th><th>Opponent</th><th></th><th class="n">Score</th></tr>${rows}</table><p class="dim" style="margin-top:8px">* after extra time or penalties. N is a neutral ground.</p>`,
      action: `<button class="b quiet" data-a="back">Back</button>` };
  },
  results(){
    const st = S.state, u = user(); const info = st.lastWeekInfo;
    if (!info) return { main: `<h1>Results</h1><p class="dim">No games played yet.</p>`, action: `<button class="b quiet" data-a="back">Back</button>` };
    let body = '';

      const d = S.tab.results || u.div;
      body = `<div class="grid2" style="grid-template-columns:repeat(4,1fr)">${[1,2,3,4].map(x=>`<button class="b ${d===x?'on':''}" data-a="rdiv" data-d="${x}">Div ${x}</button>`).join('')}</div>` + resultLines(st.lastSlim.filter(m=>m.div===d));
    } else {
      body = `<p class="dim">${E.CFG.CUPS[info.cup].name} ${E.CUP_ROUND_NAMES[info.round]}</p>` + resultLines(st.lastSlim);
    }
    const euroRes = st.lastSlim.filter(m=>m.euro);
    if (euroRes.length){ body += `<h2>Europe</h2>` + ['ec','cwc','uefa'].map(k=>{ const ms = euroRes.filter(m=>m.euro.comp===k); return ms.length? `<p class="dim" style="margin-bottom:4px">${euroComp(k).name} ${E.euroRoundName(k, ms[0].euro.round)}${ms[0].euro.leg? ', '+(ms[0].euro.leg===1?'first':'second')+' legs' : ''}</p>` + resultLines(ms) : ''; }).join(''); }
    return { main: `<h1>Week ${info.week} results</h1>${body}${sleighBogey(st)}`, action: `<button class="b quiet" data-a="back">Back</button>` };
  },
  sacked(){
    const st = S.state, u = user(); const c = st.clubs[st.sackOffer];
    const resigned = /resigned/.test(st.gameOver||'');
    return { main: `<div class="title" style="padding-top:30px"><div class="logo">${resigned? 'Resigned' : 'Sacked'}</div><p>${esc(st.gameOver)}</p>

      ${c? `<h2>One door closes</h2><p><span class="hot">${esc(c.name)}</span>, bottom of Division 4, will take anyone. They have ${money(c.balance)} in the bank and a ${E.fmt(c.capacity)} seat ground.</p>
      <div class="grid2"><button class="b" data-a="takesack">Take the job</button><button class="b" data-a="walkaway">Walk away</button></div>` : `<button class="b" data-a="walkaway">Start again</button>`}` };
  },
  weekdone(){
    const st = S.state, u = user(); const R = S.results;
    let mine = '';
    if (R.userMatch){
      const m = R.userMatch; const us = m.home.id===u.id;
      const res = m.gH===m.gA? 'Draw' : (m.gH>m.gA)===us? 'Win' : 'Defeat';
      const scorers = m.scorers.map(s=>`${esc(s.p.name)} ${s.min}'`+(s.side==='H'?'':' (a)')).join(', ');
      mine = `<h1>${res}: ${esc(m.home.short)} ${m.gH} - ${m.gA} ${esc(m.away.short)}${m.extra? (m.extra.startsWith('pens')? ' (pens)':' (aet)'):''}</h1><p class="dim">${scorers||'No goals.'}${m.extra&&m.extra.startsWith('pens')? ' Won on penalties by '+(m.extra==='pens-H'?esc(m.home.short):esc(m.away.short))+'.':''}</p>`;
    } else mine = `<h1>No match this week</h1>`;
    if (R.euroMatch){ const m = R.euroMatch; const us = m.home.id===u.id; const agg = m.agg? (us? `${m.agg.b}-${m.agg.a}` : `${m.agg.a}-${m.agg.b}`) : null; const through = m.winner!==undefined? m.winner===u.id : (m.euro.final? ((m.gH>m.gA||m.extra==='pens-H')===us) : null);
      mine += `<h2>${euroComp(m.euro.comp).name}${m.euro.leg? ' '+(m.euro.leg===1?'first':'second')+' leg' : ' final'}: ${esc(m.home.short)} ${m.gH} - ${m.gA} ${esc(m.away.short)}${m.extra? (m.extra.startsWith('pens')? ' (pens)':' (aet)'):''}</h2><p class="dim">${m.scorers.map(s=>esc(s.p.name)+' '+s.min+"'").join(', ')||'No goals.'}${agg? ` Aggregate ${agg}.`:''}${through===true? ' <span class="hot">Through.</span>' : through===false? ' Out.' : ''}</p>`; }
    const others = R.results.filter(m=>m!==R.userMatch && (R.type==='cup' || m.home.div===u.div));
    const list = others.map(m=>`<div class="kv"><span class="wrap">${esc(m.home.short)} v ${esc(m.away.short)}</span><span>${m.gH}-${m.gA}${m.extra?'*':''}</span></div>`).join('');
    const label = R.type==='cup'? `${E.CFG.CUPS[R.cup].name} results` : `Division ${u.div} results`;
    const inj = R.userMatch? R.userMatch.injuries.filter(p=>p.club===u.id) : [];

    return { main: `${mine}${inj.length? `<p class="hot">Injured: ${inj.map(p=>esc(p.name)+' ('+p.injury+' wk)').join(', ')}</p>`:''}${bans.length? `<p class="hot">Suspended: ${bans.map(b=>esc(b.p.name)+' ('+b.n+' match'+(b.n>1?'es':'')+', '+b.why+')').join(', ')}</p>`:''}
      ${st.week>1 && R.type==='league'? `<p>Now ${ordinal(u.leaguePos)} in Division ${u.div}.</p>`:''}
      <h2>${label}</h2>${list||'<p class="dim">None.</p>'}${R.type==='cup'? '<p class="dim">* after extra time or penalties</p>':''}${sleighBogey(st)}
      <button class="b" data-a="results" style="margin-top:10px">All results</button>`,
      action: `<button class="b" data-a="continue-week">${mgr().pendingReview? 'Season review' : st.gameOver? 'See the board' : 'Continue'}</button>` };
  },

      <div class="kv"><span>League prize money</span><span>${money(prize)}</span></div>
      <div class="kv"><span>Television money</span><span>${money(E.CFG.TV[sm.userDiv])}</span></div>

      ${sm.euroWinners? `<div class="kv"><span>Europe</span><span class="wrap">${['ec','cwc','uefa'].map(k=>sm.euroWinners[k]!==null&&sm.euroWinners[k]!==undefined? euroComp(k).short+': '+esc(st.clubs[sm.euroWinners[k]].short) : '').filter(Boolean).join(', ')}</span></div>` : ''}

      <div class="kv"><span>Board mood</span><span>${E.boardMood(u.confidence)}</span></div>
