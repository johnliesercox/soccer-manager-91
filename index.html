function ladderOn(){ try{ return localStorage.getItem(LADDER_OPT)!=='off'; }catch(e){ return true; } }
function trophyLine(t){ if (!t) return ''; const parts = []; const titles = t.titles||{}; for (const d of [1,2,3,4]) if (titles[d]) parts.push(`${titles[d]} D${d} title${titles[d]>1?'s':''}`); if (t.fa) parts.push(`${t.fa} FA Cup${t.fa>1?'s':''}`); if (t.lc) parts.push(`${t.lc} League Cup${t.lc>1?'s':''}`); if (t.ec) parts.push(`${t.ec} European Cup${t.ec>1?'s':''}`); if (t.cwc) parts.push(`${t.cwc} CWC`); if (t.uefa) parts.push(`${t.uefa} UEFA Cup${t.uefa>1?'s':''}`); if (t.promo) parts.push(`${t.promo} promotion${t.promo>1?'s':''}`); return parts.join(', ') || 'no trophies yet'; }
async function loadLadder(){ if (!LADDER_URL){ S.ladderRows = null; return; } const board = S.tab.board||'career'; const rows = await Ladder.top(board); S.ladderRows = rows; if (Ladder.nick()) S.ladderMe = await Ladder.me(); if (S.screen==='hof') render(); }
function readAmount(sel){ const i = $(sel||'#amt'); if (!i) return null; const raw = i.value.trim().toLowerCase().replace(/[£,\s]/g,''); let v = raw.endsWith('k')? parseFloat(raw)*1000 : raw.endsWith('m')? parseFloat(raw)*1e6 : parseFloat(raw); if (!isFinite(v) || v<1) return null; return Math.round(v); }
function jobOfferPanel(){
  const st = S.state; const c = st.clubs[st.jobOffer]; const cw = E.squadOf(st,c).reduce((s,p)=>s+p.wage,0);
  return `<h2>Job offer</h2><p><span class="hot">${esc(c.name)}</span> of Division ${c.div} want you as their manager. They have ${money(c.balance)} in the bank, a ${E.fmt(c.capacity)} seat ground and a wage bill of ${money(cw)} a week.${st.jobOfferExpires? ` Decide by week ${st.jobOfferExpires}.`:''}</p><div class="grid2"><button class="b" data-a="acceptjob">Take it</button><button class="b" data-a="declinejob">Stay put</button></div>`;
}
function resultLines(list){
  const st = S.state, u = user();
  return list.map(m=>{ const me = m.h===u.id||m.a===u.id; return `<div class="kv"><span class="wrap ${me?'hot':''}">${esc(st.clubs[m.h].short)} v ${esc(st.clubs[m.a].short)}</span><span class="${me?'hot':''}">${m.gH}-${m.gA}${m.extra?'*':''}${m.agg? ` <span class="dim">(${m.agg.b}-${m.agg.a} agg)</span>`:''}</span></div>`; }).join('') || '<p class="dim">No games.</p>';
}
function sleighBogey(st){ return ((st.season*97 + st.week*31) % 173 === 0)? `<div class="kv"><span class="hot">Sleigh Bogey</span><span class="dim">v nobody, abandoned</span></div>` : ''; }

// ---------- helpers ----------
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function posOrder(p){ return {GK:0,DEF:1,MID:2,FWD:3}[p]; }
function cupStatus(u,k){ const c = u.cup[k]; if (c.out) return `Out in the ${E.CUP_ROUND_NAMES[c.round].toLowerCase()}`; if (c.round>=6) return 'Winners!'; return `In the ${E.CUP_ROUND_NAMES[c.round].toLowerCase()}`; }
function cupTie(u,k){ const st=S.state; const t = st.cups[k].ties.find(x=>x.h===u.id||x.a===u.id); if (!t) return 'not involved'; const home = t.h===u.id; const opp = st.clubs[home?t.a:t.h]; return `${esc(opp.name)} ${home?'(home)':'(away)'}`; }
function cupSummary(k){ const st=S.state, u=user(); const cup = st.cups[k]; const alive = cup.alive.map(id=>st.clubs[id].short); let s = cupStatus(u,k)+'. '; if (st.cupWinners[k]!==null && st.cupWinners[k]!==undefined) s += `${esc(st.clubs[st.cupWinners[k]].name)} won it.`; else if (alive.length<=8) s += `Still in: ${alive.map(esc).join(', ')}.`; else s += `${alive.length} clubs left.`; if (!u.cup[k].out && cup.ties.length) s += ` Next: ${cupTie(u,k)}.`; return s; }
function selectionSummary(){ const st=S.state,u=user(); const cnt = ids => (ids||[]).filter(id=>st.players[id]&&st.players[id].club===u.id&&st.players[id].injury===0).length; const lg = cnt(st.userSel); let s = lg>=11? `${u.formation}, XI set` : lg>0? `${lg} picked, rest auto` : `auto pick (${u.formation})`; if (inEurope(u)){ const eu = cnt(st.euroSel); s += `; Europe: ${eu>=11? 'XI set' : eu>0? eu+' picked' : 'same as league'}`; } return s; }

// ---------- match animation ----------
// The matchday viewer lives in src/matchday (built into this file); see ARCHITECTURE_MATCHDAY.md.

// ---------- actions ----------
async function act(a, d){
  const st = S.state;
  switch(a){
    case 'setup': go('setup'); setTimeout(()=>{ const i=document.querySelector('.mgrname'); if(i) i.focus(); }, 50); break;
    case 'setupcount': S.setupNames = Array.from(document.querySelectorAll('.mgrname')).map(i=>i.value); S.setupCount = +d.n; if (S.setupCount>1) S.setupMode = 'classic'; render(); break;
    case 'mode': S.setupNames = Array.from(document.querySelectorAll('.mgrname')).map(i=>i.value); S.setupMode = d.m; render(); break;
    case 'start': {
      const names = Array.from(document.querySelectorAll('.mgrname')).map((i,k)=>i.value.trim() || (S.setupCount>1? 'Manager '+(k+1) : 'The Gaffer'));
      const mode = names.length>1? 'classic' : (S.setupMode||'classic');
      S.state = E.newGame({ managers: names, mode });
      Track.send('game_started', { number_of_managers: names.length, mode });
      S.hasSave = true; await save(); startTurn(0); break; }
    case 'continue': startTurn(st.cur); break;
    case 'taketurn': if (S.md && S.md.passing) Matchday.ui.afterPass(); else arriveAtTurn(); break;
    case 'ready': await endTurn(); break;
    case 'nextround': { if (S.pendingReview){ S.pendingReview=false; S.from='afterseason'; go('standings'); } else startTurn(firstActive()); } break;
    case 'standings': S.from = S.screen; go('standings'); break;
    case 'retire': if (!multi()) break; if (!S.confirmRetire){ S.confirmRetire = true; render(); toast('Tap again to leave the game to the others.'); setTimeout(()=>{ S.confirmRetire=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmRetire=false; E.retireManager(st, st.cur); await save(); toast('Off into the sunset.'); startTurn(firstActive()); } break;
    case 'quit': if (multi()) { toast('Only the last manager standing can abandon the game.'); break; } if (!S.confirmQuit){ S.confirmQuit = true; render(); toast('Tap again to confirm.'); setTimeout(()=>{ S.confirmQuit=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmQuit=false; await Store.del(SAVE_KEY); S.state=null; S.hasSave=false; go('title'); } break;
    case 'toggle': {
      const id = +d.id; const p = st.players[id]; if (!p) break;
      const ids = sel(); const k = ids.indexOf(id);
      if (k>=0) ids.splice(k,1); else if (p.injury>0) { toast(p.name+' is injured.'); break; } else ids.push(id);
      if (d.back) go('player'); else render(); break; }
    case 'formation': if (S.xiMode==='euro') user().euroFormation = d.f; else user().formation = d.f; render(); break;
    case 'autopick': { const xi = E.autoSelect(st, user(), S.xiMode==='euro'? (user().euroFormation||user().formation) : user().formation); const ids = xi.map(x=>x.p.id); if (S.xiMode==='euro') st.euroSel = ids; else st.userSel = ids; render(); toast('Best available XI picked.'); break; }
    case 'clearpick': if (S.xiMode==='euro') st.euroSel = []; else st.userSel = []; render(); break;
    case 'player': S.pid = +d.id; S.from = S.screen==='player'? S.from : S.screen; S.cYears = null; S.cWage = null; go('player'); break;
    case 'back': if (S.from==='afterseason'){ S.from=null; startTurn(firstActive()); } else if (S.from==='title'){ go('title'); } else go(S.from||'squad'); break;
    case 'setamt': { const i = $('#amt'); if (i) i.value = d.amt; break; }
    case 'setcw': { const i = $('#cwage'); if (i) i.value = d.amt; break; }
    case 'list': { const p = st.players[+d.id]; const amt = readAmount(); if (amt===null){ toast('Enter a price.'); break; } E.listPlayer(st, p.id, amt); await save(); render(); toast(p.name+' is up for sale.'); break; }
    case 'unlist': E.unlistPlayer(st, +d.id); render(); break;
    case 'bid': { const amt = readAmount(); if (amt===null){ toast('Enter an amount.'); break; } const rival = E.managerOf(st, st.players[+d.id].club); const err = E.bidForPlayer(st, +d.id, amt); if (err) toast(err); else { toast(rival? `Bid sent to ${rival.managerName}.` : 'Deal done.'); await save(); go(S.from||'transfers'); } break; }
    case 'buy': { const err = E.buyFromList(st, +d.id); if (err) toast(err); else { toast('Signed.'); await save(); if (d.back) go('transfers'); else render(); } break; }
    case 'accept': { const err = E.acceptOffer(st, +d.i); if (err) toast(err); else { toast('Sold.'); await save(); render(); } break; }
    case 'reject': E.rejectOffer(st, +d.i); render(); break;
    case 'ttab': S.tab.transfers = d.t; render(); break;
    case 'cyears': S.cWage = readAmount('#cwage'); S.cYears = +d.y; render(); break;
    case 'academy': { const err = E.upgradeAcademy(st); if (err) toast(err); else { toast('Builders booked.'); await save(); render(); } break; }
    case 'promote': { const err = E.promoteReserve(st, +d.id); if (err) toast(err); else { toast('Promoted.'); await save(); if (S.screen==='player') go(S.from||'club'); else render(); } break; }
    case 'releasereserve': { if (S.confirmRelease!==+d.id){ S.confirmRelease = +d.id; render(); toast('Tap again to let him go.'); setTimeout(()=>{ S.confirmRelease=null; if (S.screen==='player') render(); }, 4000); break; } S.confirmRelease=null; const err = E.releaseReserve(st, +d.id); if (err) toast(err); else { toast('Gone.'); await save(); go(S.from||'club'); } break; }
    case 'contract': { const yrs = S.cYears || E.wantsYears(st.players[+d.id]); const wage = readAmount('#cwage'); if (wage===null){ toast('Enter a wage.'); break; } const r = E.offerContract(st, +d.id, wage, yrs); toast(r.msg); if (r.ok){ S.cYears = null; S.cWage = null; await save(); } else S.cWage = wage; render(); break; }
    case 'letgo': { const p = st.players[+d.id]; E.letGo(st, p.id, !p.letGo); await save(); render(); toast(p.letGo? `${p.name} will leave when his deal ends.` : `${p.name} is back in your plans.`); break; }
    case 'release': { if (!S.confirmRelease || S.confirmRelease!==+d.id){ S.confirmRelease = +d.id; render(); toast('Tap again to release him.'); setTimeout(()=>{ S.confirmRelease=null; if (S.screen==='player') render(); }, 4000); break; } S.confirmRelease=null; const err = E.releasePlayer(st, +d.id); if (err) toast(err); else { toast('Released.'); await save(); go(S.from||'squad'); } break; }
    case 'signfree': { const yrs = S.cYears || E.wantsYears(st.players[+d.id]); const wage = readAmount('#cwage'); if (wage===null){ toast('Enter a wage.'); break; } const r = E.signFreeAgent(st, +d.id, wage, yrs); toast(r.msg); if (r.ok){ S.cYears = null; await save(); go('transfers'); } else render(); break; }
    case 'scoutdiv': S.tab.scout = {div:+d.d}; render(); break;
    case 'ximode': S.xiMode = d.m; render(); break;
    case 'brief': { const b = S.tab.brief; b[d.k] = (d.k==='pos'||d.k==='age')? d.v : +d.v; render(); break; }
    case 'scoutgo': { const b = S.tab.brief; const band = AGE_BANDS[b.age]||{}; S.tab.report = E.scoutSearch(st, { pos: b.pos, ageMin: band.min, ageMax: band.max, minSkill: b.skill, maxValue: b.value }); await save(); render(); break; }
    case 'scoutclub': S.tab.scout.club = +d.c; render(); break;
    case 'scoutback': S.tab.scout.club = null; render(); break;
    case 'tdiv': S.tab.table = +d.d; render(); break;
    case 'ctab': S.tab.club = d.t; render(); break;
    case 'rndiv': S.tab.rename = {div:+d.d, club:null}; render(); break;
    case 'rnclub': S.tab.rename.club = d.c===''? null : +d.c; render(); break;
    case 'renameother': { const err = E.renameAnyClub(st, +d.c, $('#oname').value, $('#oshort').value); if (err) toast(err); else { toast('Done.'); S.tab.rename.club = null; await save(); render(); } break; }
    case 'renameclub': { const err = E.renameClub(st, $('#clubname').value, $('#clubshort').value); if (err) toast(err); else { toast('Done.'); await save(); render(); } break; }
    case 'renameplayer': { const err = E.renamePlayer(st, +d.id, $('#pname').value); if (err) toast(err); else { toast('Done.'); await save(); render(); } break; }
    case 'preseason': if (st.season===1) Track.once(st, 'pre', 'preseason_opened', { number_of_managers: st.managers.length }); go('preseason'); break;
    case 'fixtures': S.from = S.screen; go('fixtures'); break;
    case 'saves': S.from = S.screen==='title'? 'title' : S.screen; S.slots = await listSlots(); S.slotName = null; go('saves'); break;
    case 'help': S.from = S.screen==='title'? 'title' : S.screen; go('help'); break;
    case 'hof': S.from = S.screen==='title'? 'title' : S.screen; S.ladderRows = undefined; go('hof'); loadLadder(); break;
    case 'whatsnew': S.from = S.screen==='title'? 'title' : S.screen; markSeen(); go('whatsnew'); break;
    case 'hoftab': S.tab.hof = d.t; render(); if (d.t==='ladder') loadLadder(); break;
    case 'board': S.tab.board = d.b; S.ladderRows = undefined; render(); loadLadder(); break;
    case 'setnick': { const v = Ladder.setNick($('#nick').value); if (!v){ toast('Give yourself a name.'); break; } toast(`You are ${v}.`); if (st) await Ladder.submit(st); S.ladderRows = undefined; Ladder.cache = {}; render(); loadLadder(); break; }
    case 'joinladder': { const v = Ladder.setNick($('#nick').value); if (!v){ toast('Give yourself a name.'); break; } S.nickPrompt = false; toast(`You are ${v}.`); await Ladder.submit(st); render(); break; }
    case 'skipladder': S.nickPrompt = false; try{ localStorage.setItem('sm91-nick-skipped', '1'); }catch(e){} render(); break;
    case 'ladderopt': try{ localStorage.setItem(LADDER_OPT, ladderOn()? 'off' : 'on'); }catch(e){} render(); break;
    case 'records': S.from = S.screen; go('records'); break;
    case 'analytics': try{ localStorage.setItem('sm91-analytics', analyticsOn()? 'off' : 'on'); }catch(e){} render(); break;
    case 'pingtest': S.pingResult = 'Sending...'; render(); S.pingResult = await Track.test(); render(); break;
    case 'title': S.slots = await listSlots(); S.slotCount = S.slots.length; go('title'); break;
    case 'saveslot': { const name = ($('#slotname')&&$('#slotname').value.trim()) || `Season ${st.season} week ${st.week}`; S.slots = await saveSlot(name); S.slotCount = S.slots.length; toast('Saved.'); render(); break; }
    case 'loadslot': { const err = await loadSlot(+d.i); if (err){ toast(err); break; } toast('Loaded.'); startTurn(S.state.cur); break; }
    case 'delslot': { if (S.confirmDel!==+d.i){ S.confirmDel = +d.i; render(); setTimeout(()=>{ if (S.confirmDel===+d.i){ S.confirmDel=null; if (S.screen==='saves') render(); } }, 4000); break; } S.confirmDel=null; await deleteSlot(+d.i); S.slots = await listSlots(); S.slotCount = S.slots.length; render(); break; }
    case 'results': S.from = (S.screen==='weekdone'||S.screen==='weekmulti')? S.screen : 'home'; go('results'); break;
    case 'rdiv': S.tab.results = +d.d; render(); break;
    case 'resign': if (!S.confirmResign){ S.confirmResign = true; render(); toast('Tap again to hand in your notice.'); setTimeout(()=>{ S.confirmResign=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmResign=false; E.resign(st); await save(); go('sacked'); } break;
    case 'takesack': { const err = E.takeSackOffer(st); if (err) toast(err); else { st.userSel = []; await save(); if (mgr().pendingReview) go('review'); else go('home'); } } break;
    case 'walkaway': {
      if (multi()){ E.retireManager(st, st.cur); if (E.activeManagers(st).length){ await save(); toast('Off into the sunset.'); startTurn(firstActive()); break; } }
      await Store.del(SAVE_KEY); S.state=null; S.hasSave=false; go('title'); break; }
    case 'home': go('home'); break;
    case 'sponsor': { const err = E.chooseSponsor(st, +d.i); if (err) toast(err); else { await save(); render(); } break; }
    case 'tickets': { const err = E.setSeasonTickets(st, +d.m); if (err) toast(err); else { await save(); render(); } break; }
    case 'loan': { const err = E.takeLoan(st, +d.amt); if (err) toast(err); else { toast('Money in.'); await save(); render(); } break; }
    case 'repay': { const err = E.repayLoan(st); if (err) toast(err); else { toast('Loan cleared.'); await save(); render(); } break; }
    case 'training': E.setTraining(st, d.t); render(); break;
    case 'staff': E.setStaff(st, d.r, +d.t); await save(); render(); break;
    case 'ticket': { const err = E.setTicketPrice(st, parseFloat(d.p)); if (err) toast(err); else { await save(); render(); } break; }
    case 'safety': { const err = E.improveSafety(st, +d.p); if (err) toast(err); else { toast('Work done.'); await save(); render(); } break; }
    case 'build': { const err = E.startBuild(st, +d.n); if (err) toast(err); else { toast('Builders booked.'); await save(); render(); } break; }
    case 'play': await playWeek(); break;
    case 'continue-week':
      if (st.gameOver){ S.pendingReview=false; go('sacked'); } else if (mgr().pendingReview){ S.pendingReview=false; go('review'); } else go('home');
      break;
    case 'acceptjob': E.acceptJob(st); st.userSel = []; await save(); render(); toast('New club, new problems.'); break;
    case 'declinejob': E.declineJob(st); await save(); render(); break;
    case 'newseason': st.userSel = (st.userSel||[]).filter(id=>st.players[id]&&st.players[id].club===st.userClub); mgr().pendingReview = false; await save(); go('home'); break;
    default: if (a.startsWith('md-')) await Matchday.ui.act(a, d);
  }
}

function inMatchday(){ return !!(S.md && (S.screen==='matchpick' || S.screen==='matchview' || S.screen==='matchresult')); }
function firstActive(){ const st = S.state; const i = st.managers.findIndex(m=>!m.retired); return i<0? 0 : i; }
function startTurn(idx){
  const st = S.state; E.saveCurrent(st); E.setCurrent(st, idx);
  if (multi()) go('pass'); else arriveAtTurn();
}
function arriveAtTurn(){
  const st = S.state; const m = mgr();
  if (st.gameOver) go('sacked');
  else if (m.pendingReview) go('review');
  else go('home');
}
async function endTurn(){
  const st = S.state; const m = mgr(); m.ready = true; E.saveCurrent(st); await save();
  const next = st.managers.findIndex(x=>!x.retired && !x.ready);
  if (next>=0) startTurn(next); else await playWeek();
}
async function playWeek(){
  const st = S.state, u = user();
  const before = st.season;
  const week = st.week; const wk = st.schedule[week-1];
  if (!multi() && E.buildXI(st, u, sel(), u.formation).length<11) toast('Fewer than 11 fit players. Playing short.');
  if (before===1 && week===1) Track.once(st, 'kick', 'first_match_kicked_off', { number_of_managers: st.managers.length, set_preseason: !(st.preseason && st.preseason.pending) });
  const results = E.advanceWeek(st);
  S.pendingReview = st.season>before;
  if (st.season>before){ Ladder.record(st); let skipped = false; try{ skipped = !!localStorage.getItem('sm91-nick-skipped'); }catch(e){} if (Ladder.on()){ if (Ladder.nick()) Ladder.submit(st); else if (!skipped) S.nickPrompt = true; } }
  const played = st.season>before? E.CFG.WEEKS : week;
  if (before===1 && played===1) Track.once(st, 'w1', 'week_1_completed', { number_of_managers: st.managers.length });
  if (before===1 && played===5) Track.once(st, 'w5', 'week_5_completed', { number_of_managers: st.managers.length });
  if (st.season>before) Track.once(st, 's'+before, 'season_completed', { season: before, number_of_managers: st.managers.length, division: user().div });
  if (st.season===2 && before===1) Track.once(st, 's2start', 'season_2_started', { number_of_managers: st.managers.length, division: user().div });
  S.results = { results, userMatch: null, week, type: wk.type, cup: wk.cup };
  await save();
  // the week is resolved and saved; what follows is presentation only (Watch / Instant per match)
  Matchday.ui.startWeek();
}

// ---------- matchday viewer ----------
Matchday.ui.install({ S, SCREENS, E, go, render, esc, $, toast, user, mgr, multi, euroComp, Track });

// ---------- wiring ----------
let busy = false;
document.addEventListener('click', async e => {
  const f = e.target.closest('[data-track]'); if (f){ Track.send(f.dataset.track, { screen: S.screen }); return; }
  const n = e.target.closest('[data-nav]'); if (n){ if (S.anim || busy || inMatchday()) return; go(n.dataset.nav); return; }
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (S.anim && t.dataset.a!=='skipanim') return;
  if (busy) return;
  busy = true;
  try { await act(t.dataset.a, t.dataset); } catch(err){ console.error(err); } finally { busy = false; }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && S.screen==='setup' && (S.setupCount||1)===1) act('start',{}); });

window.__sm91 = { S, E, render, go };
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
  navigator.serviceWorker.register('sw.js').then(reg => {
    const announce = () => { const bar = document.getElementById('updatebar'); if (bar) bar.style.display = 'block'; };
    if (reg.waiting && navigator.serviceWorker.controller) announce();
    reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state==='installed' && navigator.serviceWorker.controller) announce(); }); });
    setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
  }).catch(()=>{});
  document.getElementById('updatebar').addEventListener('click', () => { if (S.anim) return; location.reload(); });
}
(async function init(){
  const saved = await load();
  if (saved){ S.state = saved; S.hasSave = true; }
  S.slots = await listSlots(); S.slotCount = S.slots.length;
  go('title');
})();
})();
</script>
