const S = { state:null, screen:'title', tab:{transfers:'list', table:null, scout:{}, club:'money', results:null, brief:{pos:'ANY', age:'any', skill:0, value:0}, report:null}, hasSave:false, results:null, pendingReview:false, anim:null, prevSeason:1 };

function user(){ return S.state.clubs[S.state.userClub]; }
function sel(){ const st = S.state; if (!st.userSel) st.userSel = []; if (!st.euroSel) st.euroSel = []; return S.xiMode==='euro'? st.euroSel : st.userSel; }
function inEurope(u){ return !!(u.euro && !u.euro.out); }
function euroComp(k){ return E.CFG.EURO.comps[k]; }
function fmtEuroTie(t){ if (!t) return ''; if (t.final) return `${euroComp(t.comp).name} final v ${esc(t.opp.name)} (neutral)`; return `${euroComp(t.comp).name} ${E.euroRoundName(t.comp, t.round)}, ${t.g1? '2nd' : '1st'} leg v ${esc(t.opp.name)} (${t.g1? (t.homeFirst? 'A' : 'H') : (t.homeFirst? 'H' : 'A')})${t.g1? `, first leg ${t.homeFirst? t.g1[0]+'-'+t.g1[1] : t.g1[1]+'-'+t.g1[0]}` : ''}`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('show'), 2200); }
function go(screen){ S.screen = screen; render(); $('#main').scrollTop = 0; }

// ---------- rendering ----------
function render(){
  const st = S.state;
  const hdr = $('#hdr'), main = $('#main'), nav = $('#nav'), act = $('#act');
  if (!st || S.screen==='title' || S.screen==='setup' || S.screen==='pass' || ((S.screen==='saves'||S.screen==='help') && !st)){
    hdr.innerHTML = ''; hdr.style.display='none'; nav.style.display='none';
  } else {
    hdr.style.display=''; nav.style.display='';
    const u = user();
    hdr.innerHTML = `<div class="club">${esc(u.name)}${multi()? `<br><span style="font-size:12px;color:var(--grey);text-transform:none;letter-spacing:0">${esc(st.managerName)}</span>`:''}</div><div class="meta">Div ${u.div}, season ${st.season}<br>Week ${st.week} of ${E.CFG.WEEKS}<br><span class="${u.balance<0?'neg':''}">${money(u.balance)}</span></div>`;
    nav.innerHTML = ['home','squad','transfers','table','club'].map(k=>`<button data-nav="${k}" class="${S.screen===k?'on':''}">${{home:'Home',squad:'Squad',transfers:'Market',table:'Table',club:'Club'}[k]}</button>`).join('');
  }
  const r = SCREENS[S.screen];
  const out = r();
  main.innerHTML = out.main;
  act.innerHTML = out.action || '';
  act.style.display = out.action? '' : 'none';
}

const SCREENS = {
  title(){
    return { main: `<div class="title"><div class="logo">Soccer<br>Manager '91</div><div class="sub">Four divisions. Sixteen players. One overdraft.</div>
      ${S.hasSave? `<button class="b" data-a="continue">Continue current game</button>`:''}
      ${S.slotCount? `<button class="b" data-a="saves">Load a saved game</button>`:''}
      <button class="b" data-a="setup">${S.hasSave?'Start a new game':'Start'}</button>
      <button class="b" data-a="help">How to play</button>
      ${FEEDBACK_URL? `<a class="b" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener" style="text-decoration:none;text-align:left">Send feedback</a>`:''}
      <p class="dim" style="margin-top:24px;font-size:12px">Version ${APP_VERSION}. A tribute to the 1991 Amiga original. Real club names belong to their clubs.</p></div>` };
  },
  setup(){
    const n = S.setupCount || 1;
    return { main: `<h1>Who's managing?</h1><p class="dim">One phone, up to eight managers, everyone starts in Division 4 at a random club. Pass the phone round each week.</p>
      <div class="grid2" style="grid-template-columns:repeat(8,1fr)">${[1,2,3,4,5,6,7,8].map(k=>`<button class="b ${n===k?'on':''}" data-a="setupcount" data-n="${k}" style="padding:10px 0;text-align:center">${k}</button>`).join('')}</div>
      ${Array.from({length:n}).map((_,i)=>`<input class="mgrname" maxlength="18" placeholder="Manager ${i+1}" autocomplete="off" value="${esc((S.setupNames||[])[i]||'')}">`).join('')}
      <button class="b" data-a="start">${n===1? 'Take the job' : 'Start the season'}</button>` };
  },
  help(){
    const st = S.state;
    return { main: `<h1>How to play</h1>
      <p>You've been handed a Division 4 club and a modest bank balance. Get promoted, win cups, get to Europe, don't go bust. Each week you pick a team, do your business, then play the match.</p>
      <h2>The week</h2><p>Home shows this week's fixture, the board's mood and the news. Squad is where you pick the XI, set a formation and choose how hard to train. Play the match from Home. On cup weeks you might have no game, which is a good week for hard training.</p>
      <h2>Money</h2><p>Gates, sponsorship and television money in; wages, staff and ground upkeep out. Summer wages land in one lump at the season review. The overdraft limit is half your turnover; eight weeks past it and the bank has you sacked. Loans are separate and cheaper than the overdraft. Cash in the bank earns interest.</p>
      <h2>Pre-season</h2><p>Each season starts with a sponsor to choose (safe money, per-win money, or a bigger cheque with a relegation clause) and a season ticket price. Cheap season tickets bring cash now but most of those fans would have paid on the gate anyway.</p>
      <h2>Players</h2><p>Skill is what he is now; the ▲ is how far he could go, and you only see that with a scout. Players improve in training until about 30 (faster with a better coach), then decline. Fitness under 70 doubles the injury risk. Wages reset to match skill every summer.</p>
      <h2>The market</h2><p>The weekly list is other clubs' fringe players at fair prices. The scout will search on a brief (position, age, skill, price) or you can browse any club and bid for anyone; clubs want well over the value and won't sell someone they just signed. List your own players and offers arrive over the following weeks. European clubs will come for your best player once you're in Division 3.</p>
      <h2>Staff and ground</h2><p>Coach speeds up training, physio shortens injuries, scout widens the search and reveals potential. Ground safety falls slowly; let it slide and you'll get crowd trouble and fines. Build a stand only when the Ground tab says you're turning people away. Set your own ticket price there too.</p>
      <h2>Cups and Europe</h2><p>League Cup in the first half of the season, FA Cup in the second, both straight knockout. Win the league for the European Cup, the FA Cup for the Cup Winners' Cup, or finish second or third for the UEFA Cup. European ties are two legs midweek on top of the league, with their own XI.</p>
      <h2>Several managers</h2><p>Up to eight on one phone, passing it round each week. You can bid for each other's players (they decide on their turn), rename each other's rivals, and the managers' table settles who's winning.</p>
      <h2>Saves</h2><p>The game autosaves every week. Saves on the home screen keeps named copies you can load later, for instance before a cup final.</p>`,
      action: `<button class="b quiet" data-a="${st? 'back' : 'title'}">Back</button>` };
  },
  saves(){
    const st = S.state; const slots = S.slots||[];
    const when = ts => { const d = new Date(ts); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); };
    const cur = st? `<h2>Save this game</h2><p class="dim">Saves the whole game${multi()? ' for every manager':''} as it is right now. Up to eight saves are kept; the oldest is dropped.</p>
      <input id="slotname" maxlength="30" value="${esc(S.slotName||`${user().short}, season ${st.season} week ${st.week}`)}" autocomplete="off"><button class="b" data-a="saveslot">Save</button>` : '';

      ${st.jobOffer!==null? jobOfferPanel() : ''}

      <h2>News</h2>${news.length? `<ul class="news">${news.map(n=>`<li class="${n.kind==='warn'?'warn':''}"><span class="dim">Wk ${n.w}</span> ${esc(n.text)}</li>`).join('')}</ul>` : '<p class="dim">Nothing yet.</p>'}

        body = scoutBrief() + `<h2>Or browse a club</h2><p class="dim">Bid for any player in the game. You'll pay over the odds.${u.staff.scout<2? ' A good scout can also browse Europe.' : ''}</p><div class="grid2" style="grid-template-columns:repeat(5,1fr)">${[1,2,3,4].map(d=>`<button class="b ${div===d?'on':''}" data-a="scoutdiv" data-d="${d}" style="padding:10px 2px;font-size:12px;text-align:center">Div ${d}</button>`).join('')}<button class="b ${div===0?'on':''}" data-a="scoutdiv" data-d="0" style="padding:10px 2px;font-size:12px;text-align:center">Europe</button></div>`+
          (div===0 && u.staff.scout<2? `<p class="dim">Your scout doesn't have the contacts abroad. Hire a good one.</p>` :
          E.divClubs(st,div).filter(c=>c.id!==u.id).sort((a,b)=>div===0? b.rating-a.rating : a.name.localeCompare(b.name)).map(c=>{ const hm = E.managerOf(st,c.id); return `<button class="b" data-a="scoutclub" data-c="${c.id}">${esc(c.name)}${div===0? ` <span class="dim">${c.rating}</span>`:''}${hm? ` <span class="dim">(${esc(hm.managerName)})</span>`:''}</button>`; }).join(''));
      } else {
        const c = st.clubs[sc.club];
        const sq = E.squadOf(st,c).slice().sort((a,b)=>posOrder(a.pos)-posOrder(b.pos)||b.skill-a.skill);
        body = `<button class="b" data-a="scoutback">‹ ${esc(c.name)}, ${c.div? 'Division '+c.div : 'Europe'}</button><table><tr><th>Pos</th><th>Player</th><th class="n">Sk</th><th class="n">Age</th><th class="n">Value</th></tr>`+
          sq.map(p=>`<tr class="tap" data-a="player" data-id="${p.id}"><td>${p.pos}</td><td class="wrap">${esc(p.name)}</td><td class="n">${p.skill}${potTag(p)}</td><td class="n">${p.age}</td><td class="n">${money(p.value)}</td></tr>`).join('')+`</table>`;
      }
    }
    return { main: `<h1>Transfer market</h1>${tabs}${body}` };
  },
  table(){
    const st = S.state, u = user(); const d = S.tab.table || u.div;
    const tb = E.tableFor(st,d);
    const rows = tb.map((c,i)=>`<tr class="${c.id===u.id?'me':''} ${i===1&&d>1?'line-promo':''} ${i===14&&d<4?'line-releg':''}"><td class="n">${i+1}</td><td class="wrap">${esc(c.short)}</td><td class="n">${c.st.p}</td><td class="n">${c.st.w}</td><td class="n">${c.st.d}</td><td class="n">${c.st.l}</td><td class="n">${c.st.gf-c.st.ga>0?'+':''}${c.st.gf-c.st.ga}</td><td class="n">${c.st.pts}</td></tr>`).join('');
    const cupLines = ['lc','fa'].map(k=>`<h2>${E.CFG.CUPS[k].name}</h2><p class="dim">${st.cups[k].history.length? cupSummary(k) : 'First round draw: '+cupTie(u,k)}</p>`).join('') + euroSection();
    return { main: `<h1>League tables</h1><div class="grid2" style="grid-template-columns:repeat(4,1fr)">${[1,2,3,4].map(x=>`<button class="b ${d===x?'on':''}" data-a="tdiv" data-d="${x}">Div ${x}</button>`).join('')}</div>
      <table class="tight"><tr><th class="n">#</th><th>Club</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">GD</th><th class="n">Pts</th></tr>${rows}</table>
      <p class="dim" style="margin-top:8px">Top two go up, bottom two go down.</p>${multi()? `<button class="b" data-a="standings">Managers' table</button>`:''}${scorersTable(d)}${cupLines}` };
  },
  club(){
    const t = S.tab.club;
    const tabs = `<div class="grid2" style="grid-template-columns:repeat(4,1fr)">${['money','ground','staff','name'].map(k=>`<button class="b ${t===k?'on':''}" data-a="ctab" data-t="${k}">${{money:'Money',ground:'Ground',staff:'Staff',name:'Name'}[k]}</button>`).join('')}</div>`;
    const body = t==='ground'? groundScreen() : t==='staff'? staffScreen() : t==='name'? nameScreen() : SCREENS.money().main;
    return { main: tabs + body };
  },
  money(){
    const st = S.state, u = user();
    const wages = E.squadOf(st,u).reduce((s,p)=>s+p.wage,0);
    const ground = Math.round(u.capacity*E.CFG.GROUND_COST_PER_SEAT);
    const ledger = u.ledger.slice(-25).reverse();
    const rn = r => r>=6?'won':r===5?'final':r===4?'SF':r===3?'QF':'R'+(r+1);
    const hist = u.history.slice().reverse().map(h=>`<div class="kv"><span>Season ${h.season}</span><span>Div ${h.div}, ${ordinal(h.pos)}, ${h.pts} pts, LC ${rn(h.lc||0)}, FA ${rn(h.fa||0)}</span></div>`).join('');
    return { main: `<h1>Finances</h1>
      <div class="kv"><span>Balance</span><span class="${u.balance<0?'hot':''}">${money(u.balance)}</span></div>
      <div class="kv"><span>Overdraft limit</span><span>${money(E.overdraftLimit(st, u))}</span></div>
      <div class="kv"><span>Turnover</span><span>about ${money(Math.round(E.turnover(st,u)/1000)*1000)} a season</span></div>
      <div class="kv"><span>Player wages</span><span>${money(wages)} a week</span></div>
      <div class="kv"><span>Staff wages</span><span>${money(E.staffWages(u))} a week</span></div>
      <div class="kv"><span>Ground upkeep</span><span>${money(ground)} a week</span></div>
      <div class="kv"><span>Ground</span><span>${E.fmt(u.capacity)} capacity</span></div>
      <div class="kv"><span>Ticket price</span><span>£${E.ticketOf(u)} <span class="dim">(set it on the Ground tab)</span></span></div>
      <div class="kv"><span>Sponsor</span><span>${st.sponsor? esc(st.sponsor.name)+(st.sponsor.type==='perwin'? ', '+money(st.sponsor.perWin)+' a win' : st.sponsor.type==='bold'? ', clawback '+money(st.sponsor.clawback) : '') : 'not yet signed'}</span></div>
      <div class="kv"><span>Season tickets</span><span>${st.seasonTicket? E.fmt(st.seasonTicket.sold)+' at £'+st.seasonTicket.price : 'not yet on sale'}</span></div>
      <h2>Bank loan</h2>
      ${st.loan? `<p>${money(st.loan.amount)} borrowed, ${money(st.loan.weekly)} a week, ${st.loan.weeksLeft} payments left.</p><button class="b" data-a="repay">Settle it now for ${money(Math.round(st.loan.weekly*st.loan.weeksLeft*0.95/500)*500)}</button>`
        : `<p class="dim">Up to ${money(E.loanMax(st, u))} at 12%, repaid over 36 weeks. Separate from the overdraft, which is ${money(E.overdraftLimit(st, u))}.</p><div class="grid3">${[0.25,0.5,1].map(f=>{ const mx = E.loanMax(st, u); const a = f===1? mx : Math.floor(mx*f/5000)*5000; return `<button class="b" data-a="loan" data-amt="${a}">${money(a)}<br><span class="dim">${money(Math.round(a*1.12/36))}/wk</span></button>`; }).join('')}</div>`}
      <p class="dim" style="margin-top:10px">Money in the bank earns 0.1% a week (about 5% a year). Anything below zero costs 0.25% a week. Eight weeks past the overdraft limit and the bank pulls the plug. The limit is half your turnover (gates, television and sponsorship), so it grows as the club does.</p>
      <h2>Recent</h2>${ledger.length? ledger.map(l=>`<div class="kv"><span class="dim">Wk ${l.w}</span><span>${esc(l.label)} <span class="${l.amount<0?'':'hot'}">${money(l.amount)}</span></span></div>`).join('') : '<p class="dim">Nothing yet.</p>'}
      ${hist? `<h2>Past seasons</h2>${hist}`:''}` };
  },
  match(){
    const m = S.results.userMatch; const st = S.state, u = user();
    const us = m.home.id===u.id;
    const comp = m.euro? `${euroComp(m.euro.comp).name} ${E.euroRoundName(m.euro.comp, m.euro.round)}${m.euro.leg? ', '+(m.euro.leg===1?'first':'second')+' leg' : ''}` : m.cup!==undefined? `${E.CFG.CUPS[m.cupKey].name} ${E.CUP_ROUND_NAMES[m.cup]}` : `League, week ${S.results.week}`;
    return { main: `<p class="dim" style="text-align:center">${comp}</p>
      <div class="clock" id="clock">0'</div>
      <div class="score" id="score"><span class="${us?'hot':''}">${esc(m.home.short)}</span> 0 - 0 <span class="${!us?'hot':''}">${esc(m.away.short)}</span><small id="scoresub">Attendance ${E.fmt(m.att)}</small></div>
      <div class="events" id="events"></div>`,
      action: `<button class="b quiet" data-a="skipanim" id="skipbtn">Skip</button>` };
  },
  fixtures(){
    const st = S.state, u = user();
    const rows = st.schedule.map((wk,i)=>{
      const w = i+1; const r = st.userResults[w];
      let comp, oppName, where, res = '';
      if (r){
        const opp = st.clubs[r.opp]; comp = r.cup? E.CFG.CUPS[r.cup].short+' '+ROUND_SHORT[r.round] : 'League';
        oppName = opp.short; where = r.home? 'H':'A';
        const won = r.gF>r.gA || (r.extra==='pens-H'&&r.home) || (r.extra==='pens-A'&&!r.home);
        res = `<span class="${won?'hot':''}">${r.gF}-${r.gA}${r.extra?'*':''}</span>`;
        if (r.club!==u.id) oppName += ` <span class="dim">(with ${esc(st.clubs[r.club].short)})</span>`;
      } else if (wk.type==='league'){
        const f = st.fixtures[u.div][wk.round].find(x=>x.h===u.id||x.a===u.id);
        comp = 'League'; oppName = st.clubs[f.h===u.id? f.a : f.h].short; where = f.h===u.id? 'H':'A';
      } else {
        const cup = E.CFG.CUPS[wk.cup]; comp = cup.short+' '+ROUND_SHORT[wk.round];
        const mine = u.cup[wk.cup];
        const t = (!mine.out && wk.round===mine.round)? st.cups[wk.cup].ties.find(x=>x.h===u.id||x.a===u.id) : null;
        if (mine.out){ oppName = '<span class="dim">out</span>'; where=''; }
        else if (t){ oppName = st.clubs[t.h===u.id? t.a : t.h].short; where = wk.round===5? 'N' : t.h===u.id? 'H':'A'; }
        else { oppName = '<span class="dim">if still in</span>'; where=''; }
      }
      let euroRow = '';
      const ue = (st.userEuro||{})[w]; const slot = E.euroSlot(w);
      if (ue){ const won = ue.gF>ue.gA || (ue.extra==='pens-H'&&ue.home) || (ue.extra==='pens-A'&&!ue.home); euroRow = `<tr class="${w===st.week?'me':''}"><td></td><td>${euroComp(ue.comp).short}</td><td class="wrap">${esc(st.clubs[ue.opp].short)}${ue.agg? ` <span class="dim">agg ${ue.agg[0]}-${ue.agg[1]}</span>`:''}</td><td>${ue.final?'N':ue.home?'H':'A'}</td><td class="n"><span class="${won?'hot':''}">${ue.gF}-${ue.gA}${ue.extra?'*':''}</span></td></tr>`; }
      else if (slot && inEurope(u) && w>=st.week){ const et = E.euroTieFor(st, u.id); const mine = (slot.final && et && et.final) || (et && !et.final && !slot.final && et.round===slot.slot); euroRow = `<tr class="${w===st.week?'me':''}"><td></td><td>${euroComp(u.euro.comp).short}</td><td class="wrap">${mine? esc(et.opp.short) : '<span class="dim">if still in</span>'}</td><td>${mine? (slot.final?'N': (slot.leg===1? (et.homeFirst?'H':'A') : (et.homeFirst?'A':'H'))) : ''}</td><td></td></tr>`; }
      return `<tr class="${w===st.week?'me':''}"><td class="n">${w}</td><td>${comp}</td><td class="wrap">${oppName}</td><td>${where}</td><td class="n">${res}</td></tr>${euroRow}`;
    }).join('');
    return { main: `<h1>Season ${st.season} fixtures</h1><table class="tight"><tr><th class="n">Wk</th><th>Comp</th><th>Opponent</th><th></th><th class="n">Score</th></tr>${rows}</table><p class="dim" style="margin-top:8px">* after extra time or penalties. N is a neutral ground.</p>`,
      action: `<button class="b quiet" data-a="back">Back</button>` };
  },
  results(){
    const st = S.state, u = user(); const info = st.lastWeekInfo;
    if (!info) return { main: `<h1>Results</h1><p class="dim">No games played yet.</p>`, action: `<button class="b quiet" data-a="back">Back</button>` };
    let body = '';
    if (info.type==='league'){
      const d = S.tab.results || u.div;
      body = `<div class="grid2" style="grid-template-columns:repeat(4,1fr)">${[1,2,3,4].map(x=>`<button class="b ${d===x?'on':''}" data-a="rdiv" data-d="${x}">Div ${x}</button>`).join('')}</div>` + resultLines(st.lastSlim.filter(m=>m.div===d));
    } else {
      body = `<p class="dim">${E.CFG.CUPS[info.cup].name} ${E.CUP_ROUND_NAMES[info.round]}</p>` + resultLines(st.lastSlim);
    }
    const euroRes = st.lastSlim.filter(m=>m.euro);
    if (euroRes.length){ body += `<h2>Europe</h2>` + ['ec','cwc','uefa'].map(k=>{ const ms = euroRes.filter(m=>m.euro.comp===k); return ms.length? `<p class="dim" style="margin-bottom:4px">${euroComp(k).name} ${E.euroRoundName(k, ms[0].euro.round)}${ms[0].euro.leg? ', '+(ms[0].euro.leg===1?'first':'second')+' legs' : ''}</p>` + resultLines(ms) : ''; }).join(''); }
    return { main: `<h1>Week ${info.week} results</h1>${body}${sleighBogey(st)}`, action: `<button class="b quiet" data-a="back">Back</button>` };
  },
  sacked(){
    const st = S.state, u = user(); const c = st.clubs[st.sackOffer];
    const resigned = /resigned/.test(st.gameOver||'');
    return { main: `<div class="title" style="padding-top:30px"><div class="logo">${resigned? 'Resigned' : 'Sacked'}</div><p>${esc(st.gameOver)}</p>
      <p class="dim">${esc(st.managerName)} leaves ${esc(u.name)} after ${u.history.length} full season${u.history.length===1?'':'s'}, with the club ${ordinal(u.leaguePos)} in Division ${u.div} and ${money(u.balance)} in the bank.</p></div>
      ${c? `<h2>One door closes</h2><p><span class="hot">${esc(c.name)}</span>, bottom of Division 4, will take anyone. They have ${money(c.balance)} in the bank and a ${E.fmt(c.capacity)} seat ground.</p>
      <div class="grid2"><button class="b" data-a="takesack">Take the job</button><button class="b" data-a="walkaway">Walk away</button></div>` : `<button class="b" data-a="walkaway">Start again</button>`}` };
  },
  weekdone(){
    const st = S.state, u = user(); const R = S.results;
    let mine = '';
    if (R.userMatch){
      const m = R.userMatch; const us = m.home.id===u.id;
      const res = m.gH===m.gA? 'Draw' : (m.gH>m.gA)===us? 'Win' : 'Defeat';
      const scorers = m.scorers.map(s=>`${esc(s.p.name)} ${s.min}'`+(s.side==='H'?'':' (a)')).join(', ');
      mine = `<h1>${res}: ${esc(m.home.short)} ${m.gH} - ${m.gA} ${esc(m.away.short)}${m.extra? (m.extra.startsWith('pens')? ' (pens)':' (aet)'):''}</h1><p class="dim">${scorers||'No goals.'}${m.extra&&m.extra.startsWith('pens')? ' Won on penalties by '+(m.extra==='pens-H'?esc(m.home.short):esc(m.away.short))+'.':''}</p>`;
    } else mine = `<h1>No match this week</h1>`;
    if (R.euroMatch){ const m = R.euroMatch; const us = m.home.id===u.id; const agg = m.agg? (us? `${m.agg.b}-${m.agg.a}` : `${m.agg.a}-${m.agg.b}`) : null; const through = m.winner!==undefined? m.winner===u.id : (m.euro.final? ((m.gH>m.gA||m.extra==='pens-H')===us) : null);
      mine += `<h2>${euroComp(m.euro.comp).name}${m.euro.leg? ' '+(m.euro.leg===1?'first':'second')+' leg' : ' final'}: ${esc(m.home.short)} ${m.gH} - ${m.gA} ${esc(m.away.short)}${m.extra? (m.extra.startsWith('pens')? ' (pens)':' (aet)'):''}</h2><p class="dim">${m.scorers.map(s=>esc(s.p.name)+' '+s.min+"'").join(', ')||'No goals.'}${agg? ` Aggregate ${agg}.`:''}${through===true? ' <span class="hot">Through.</span>' : through===false? ' Out.' : ''}</p>`; }
    const others = R.results.filter(m=>m!==R.userMatch && (R.type==='cup' || m.home.div===u.div));
    const list = others.map(m=>`<div class="kv"><span class="wrap">${esc(m.home.short)} v ${esc(m.away.short)}</span><span>${m.gH}-${m.gA}${m.extra?'*':''}</span></div>`).join('');
    const label = R.type==='cup'? `${E.CFG.CUPS[R.cup].name} results` : `Division ${u.div} results`;
    const inj = R.userMatch? R.userMatch.injuries.filter(p=>p.club===u.id) : [];
    return { main: `${mine}${inj.length? `<p class="hot">Injured: ${inj.map(p=>esc(p.name)+' ('+p.injury+' wk)').join(', ')}</p>`:''}
      ${st.week>1 && R.type==='league'? `<p>Now ${ordinal(u.leaguePos)} in Division ${u.div}.</p>`:''}
      <h2>${label}</h2>${list||'<p class="dim">None.</p>'}${R.type==='cup'? '<p class="dim">* after extra time or penalties</p>':''}${sleighBogey(st)}
      <button class="b" data-a="results" style="margin-top:10px">All results</button>`,
      action: `<button class="b" data-a="continue-week">${mgr().pendingReview? 'Season review' : st.gameOver? 'See the board' : 'Continue'}</button>` };
  },
  review(){
    const st = S.state, u = user(); const sm = st.seasonSummary;
    const old = st.clubs[sm.userClubId!==undefined? sm.userClubId : u.id];
    const moved = old.id!==u.id;
    const prize = E.prizeFor(sm.userDiv, sm.userPos);
    const promoted = sm.promoted.includes(old.id), relegated = sm.relegated.includes(old.id);
    const cupLine = ['lc','fa'].map(k=>sm.cupWinners[k]!==null? `${E.CFG.CUPS[k].short}: ${esc(st.clubs[sm.cupWinners[k]].short)}` : '').filter(Boolean).join(', ');
    let verdict = promoted? `${esc(old.short)} go up to Division ${old.div}. The board are thrilled and the bank is nervous.` : relegated? `${esc(old.short)} go down to Division ${old.div}. The board are not thrilled.` : sm.userPos<=sm.userExpected-3? `A better season than the board expected.` : sm.userPos>=sm.userExpected+3? `Below what the board expected. They've noticed.` : `About what the board expected.`;
    const tb = sm.tables[sm.userDiv];
    const rows = tb.map((c,i)=>`<tr class="${c.id===old.id?'me':''}"><td class="n">${i+1}</td><td class="wrap">${esc(st.clubs[c.id].short)}</td><td class="n">${c.st.pts}</td></tr>`).join('');
    let job = '';
    if (st.jobOffer!==null) job = jobOfferPanel();
    return { main: `<h1>Season ${sm.season} review</h1>
      <p>${moved? esc(old.short)+' finished' : 'Finished'} <span class="hot">${ordinal(sm.userPos)}</span> in Division ${sm.userDiv} (board expected ${ordinal(sm.userExpected)}). ${verdict}</p>${moved? `<p class="hot">You have moved to ${esc(u.name)} in Division ${u.div}.</p>`:''}
      <div class="kv"><span>League prize money</span><span>${money(prize)}</span></div>
      <div class="kv"><span>Television money</span><span>${money(E.CFG.TV[sm.userDiv])}</span></div>
      <div class="kv"><span>Summer wages</span><span>${money(-(sm.summerWages||0))}</span></div>
      <div class="kv"><span>Cups</span><span>${cupLine}</span></div>
      ${sm.euro? `<div class="kv"><span>${esc(sm.euro.name)}</span><span>${sm.euro.won? '<span class="hot">Winners!</span>' : 'out in the '+E.euroRoundName(sm.euro.comp, sm.euro.round).toLowerCase()}</span></div>` : ''}
      ${sm.euroWinners? `<div class="kv"><span>Europe</span><span class="wrap">${['ec','cwc','uefa'].map(k=>sm.euroWinners[k]!==null&&sm.euroWinners[k]!==undefined? euroComp(k).short+': '+esc(st.clubs[sm.euroWinners[k]].short) : '').filter(Boolean).join(', ')}</span></div>` : ''}
      ${sm.qualified? `<div class="kv"><span>Next season</span><span class="hot">${euroComp(sm.qualified).name}</span></div>` : ''}
      ${sm.clawback? `<div class="kv"><span>Sponsor clawback</span><span class="hot">${money(-sm.clawback)}</span></div>`:''}
      <div class="kv"><span>Board mood</span><span>${E.boardMood(u.confidence)}</span></div>
      <div class="kv"><span>Bank</span><span class="${u.balance<0?'hot':''}">${money(u.balance)}</span></div>
      ${job}<h2>Final table</h2><table><tr><th class="n">#</th><th>Club</th><th class="n">Pts</th></tr>${rows}</table>
      <p class="dim" style="margin-top:10px">Players have aged a year. Check the squad before the new season: some will have retired and the youth team has filled the gaps.</p>`,
      action: st.jobOffer!==null? '' : `<button class="b" data-a="newseason">${multi()? 'On to season '+st.season : 'Start season '+st.season}</button>` };
  },
  gameover(){
    const st = S.state, u = user();
    return { main: `<div class="title"><div class="logo">Sacked</div><p>${esc(st.gameOver)}</p><p class="dim">${esc(st.managerName)} leaves ${esc(u.name)} after ${u.history.length} full season${u.history.length===1?'':'s'}, with the club ${ordinal(u.leaguePos)} in Division ${u.div} and ${money(u.balance)} in the bank.</p></div>`,
      action: `<button class="b" data-a="setup">Start again</button>` };
  },
};

// ---------- ground and staff ----------
function groundScreen(){
  const st = S.state, u = user();
  const restricted = u.safety < E.CFG.SAFETY_RESTRICT_BELOW;
  const risk = u.safety < E.CFG.CROWD_TROUBLE_BELOW;
  const safetyWord = u.safety>=80?'excellent':u.safety>=60?'sound':u.safety>=45?'tired':u.safety>=25?'poor':'dangerous';
  return `<h1>${esc(u.name)}'s ground</h1>${ticketLines(u)}
    <h2>The ground</h2>
    <div class="kv"><span>Capacity</span><span>${E.fmt(u.capacity)}${restricted? ` <span class="hot">(restricted to ${E.fmt(Math.round(u.capacity*0.6))})</span>`:''}</span></div>
    <div class="kv"><span>Upkeep</span><span>${money(Math.round(u.capacity*E.CFG.GROUND_COST_PER_SEAT))} a week</span></div>
    ${gateLines(u)}

// ---------- match animation ----------
let animToken = 0;
function startAnimation(){
  if (S.anim){ clearTimeout(S.anim); S.anim = null; }
  const token = ++animToken;
  const m = S.results.userMatch; const u = user(); const us = m.home.id===u.id;
  const ev = m.scorers.slice(); let gH=0, gA=0, t=0, i=0;
  const clock = $('#clock'), score = $('#score'), events = $('#events');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = () => {
    if (token!==animToken) return;
    t++;
    while (i<ev.length && ev[i].min<=t){ const s = ev[i++]; if (s.side==='H') gH++; else gA++;
      const ours = (s.side==='H')===us;
      events.insertAdjacentHTML('beforeend', `<div class="${ours?'us':''}">${s.min}' GOAL ${esc(s.p.name)} (${esc(s.side==='H'?m.home.short:m.away.short)}) ${gH}-${gA}</div>`); }
    clock.textContent = t+"'";
    score.innerHTML = `<span class="${us?'hot':''}">${esc(m.home.short)}</span> ${gH} - ${gA} <span class="${!us?'hot':''}">${esc(m.away.short)}</span><small>Attendance ${E.fmt(m.att)}</small>`;
    if (t>=90){ finish(); return; }
    S.anim = setTimeout(step, 60);
  };
  const finish = () => {
    if (token!==animToken) return;
    clearTimeout(S.anim); S.anim = null;
    clock.textContent = 'FT';
    let extra = '';
    if (m.extra==='aet') extra = `<div>After extra time: ${m.gH}-${m.gA}</div>`;
    else if (m.extra && m.extra.startsWith('pens')) extra = `<div>Level after extra time. ${esc(m.extra==='pens-H'?m.home.short:m.away.short)} win on penalties.</div>`;
    events.innerHTML = m.scorers.map(s=>`<div class="${(s.side==='H')===us?'us':''}">${s.min}' GOAL ${esc(s.p.name)} (${esc(s.side==='H'?m.home.short:m.away.short)})</div>`).join('') + extra;
    score.innerHTML = `<span class="${us?'hot':''}">${esc(m.home.short)}</span> ${m.gH} - ${m.gA} <span class="${!us?'hot':''}">${esc(m.away.short)}</span><small>Attendance ${E.fmt(m.att)}</small>`;
    $('#act').innerHTML = `<button class="b" data-a="afteranim">Full time</button>`;
  };
  if (reduced){ finish(); return; }
  S.anim = setTimeout(step, 400);
  S.finishAnim = finish;
}

// ---------- actions ----------
async function act(a, d){
  const st = S.state;
  switch(a){
    case 'setup': go('setup'); setTimeout(()=>{ const i=document.querySelector('.mgrname'); if(i) i.focus(); }, 50); break;
    case 'setupcount': S.setupNames = Array.from(document.querySelectorAll('.mgrname')).map(i=>i.value); S.setupCount = +d.n; render(); break;
    case 'start': {
      const names = Array.from(document.querySelectorAll('.mgrname')).map((i,k)=>i.value.trim() || (S.setupCount>1? 'Manager '+(k+1) : 'The Gaffer'));
      S.state = E.newGame({ managers: names });
      S.hasSave = true; await save(); startTurn(0); break; }
    case 'continue': startTurn(st.cur); break;
    case 'taketurn': arriveAtTurn(); break;
    case 'ready': await endTurn(); break;
    case 'nextround': { if (S.pendingReview){ S.pendingReview=false; S.from='afterseason'; go('standings'); } else startTurn(firstActive()); } break;
    case 'standings': S.from = S.screen; go('standings'); break;
    case 'retire': if (!multi()) break; if (!S.confirmRetire){ S.confirmRetire = true; render(); toast('Tap again to leave the game to the others.'); setTimeout(()=>{ S.confirmRetire=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmRetire=false; E.retireManager(st, st.cur); await save(); toast('Off into the sunset.'); startTurn(firstActive()); } break;
    case 'quit': if (multi()) { toast('Only the last manager standing can abandon the game.'); break; } if (!S.confirmQuit){ S.confirmQuit = true; render(); toast('Tap again to confirm.'); setTimeout(()=>{ S.confirmQuit=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmQuit=false; await Store.del(SAVE_KEY); S.state=null; S.hasSave=false; go('title'); } break;
    case 'toggle': {
      const id = +d.id; const p = st.players[id]; if (!p) break;
      const ids = sel(); const k = ids.indexOf(id);
      if (k>=0) ids.splice(k,1); else if (p.injury>0) { toast(p.name+' is injured.'); break; } else ids.push(id);
      if (d.back) go('player'); else render(); break; }
    case 'formation': if (S.xiMode==='euro') user().euroFormation = d.f; else user().formation = d.f; render(); break;
    case 'autopick': { const xi = E.autoSelect(st, user(), S.xiMode==='euro'? (user().euroFormation||user().formation) : user().formation); const ids = xi.map(x=>x.p.id); if (S.xiMode==='euro') st.euroSel = ids; else st.userSel = ids; render(); toast('Best available XI picked.'); break; }
    case 'clearpick': if (S.xiMode==='euro') st.euroSel = []; else st.userSel = []; render(); break;
    case 'player': S.pid = +d.id; S.from = S.screen==='player'? S.from : S.screen; go('player'); break;
    case 'back': if (S.from==='afterseason'){ S.from=null; startTurn(firstActive()); } else if (S.from==='title'){ go('title'); } else go(S.from||'squad'); break;
    case 'setamt': { const i = $('#amt'); if (i) i.value = d.amt; break; }
    case 'list': { const p = st.players[+d.id]; const amt = readAmount(); if (amt===null){ toast('Enter a price.'); break; } E.listPlayer(st, p.id, amt); await save(); render(); toast(p.name+' is up for sale.'); break; }
    case 'unlist': E.unlistPlayer(st, +d.id); render(); break;
    case 'bid': { const amt = readAmount(); if (amt===null){ toast('Enter an amount.'); break; } const rival = E.managerOf(st, st.players[+d.id].club); const err = E.bidForPlayer(st, +d.id, amt); if (err) toast(err); else { toast(rival? `Bid sent to ${rival.managerName}.` : 'Deal done.'); await save(); go(S.from||'transfers'); } break; }
    case 'buy': { const err = E.buyFromList(st, +d.id); if (err) toast(err); else { toast('Signed.'); await save(); if (d.back) go('transfers'); else render(); } break; }
    case 'accept': { const err = E.acceptOffer(st, +d.i); if (err) toast(err); else { toast('Sold.'); await save(); render(); } break; }
    case 'reject': E.rejectOffer(st, +d.i); render(); break;
    case 'ttab': S.tab.transfers = d.t; render(); break;
    case 'scoutdiv': S.tab.scout = {div:+d.d}; render(); break;
    case 'ximode': S.xiMode = d.m; render(); break;
    case 'brief': { const b = S.tab.brief; b[d.k] = (d.k==='pos'||d.k==='age')? d.v : +d.v; render(); break; }
    case 'scoutgo': { const b = S.tab.brief; const band = AGE_BANDS[b.age]||{}; S.tab.report = E.scoutSearch(st, { pos: b.pos, ageMin: band.min, ageMax: band.max, minSkill: b.skill, maxValue: b.value }); await save(); render(); break; }
    case 'scoutclub': S.tab.scout.club = +d.c; render(); break;
    case 'scoutback': S.tab.scout.club = null; render(); break;
    case 'tdiv': S.tab.table = +d.d; render(); break;
    case 'ctab': S.tab.club = d.t; render(); break;
    case 'rndiv': S.tab.rename = {div:+d.d, club:null}; render(); break;
    case 'rnclub': S.tab.rename.club = d.c===''? null : +d.c; render(); break;
    case 'renameother': { const err = E.renameAnyClub(st, +d.c, $('#oname').value, $('#oshort').value); if (err) toast(err); else { toast('Done.'); S.tab.rename.club = null; await save(); render(); } break; }
    case 'renameclub': { const err = E.renameClub(st, $('#clubname').value, $('#clubshort').value); if (err) toast(err); else { toast('Done.'); await save(); render(); } break; }
    case 'renameplayer': { const err = E.renamePlayer(st, +d.id, $('#pname').value); if (err) toast(err); else { toast('Done.'); await save(); render(); } break; }
    case 'preseason': go('preseason'); break;
    case 'fixtures': S.from = S.screen; go('fixtures'); break;
    case 'saves': S.from = S.screen==='title'? 'title' : S.screen; S.slots = await listSlots(); S.slotName = null; go('saves'); break;
    case 'help': S.from = S.screen==='title'? 'title' : S.screen; go('help'); break;
    case 'title': S.slots = await listSlots(); S.slotCount = S.slots.length; go('title'); break;
    case 'saveslot': { const name = ($('#slotname')&&$('#slotname').value.trim()) || `Season ${st.season} week ${st.week}`; S.slots = await saveSlot(name); S.slotCount = S.slots.length; toast('Saved.'); render(); break; }
    case 'loadslot': { const err = await loadSlot(+d.i); if (err){ toast(err); break; } toast('Loaded.'); startTurn(S.state.cur); break; }
    case 'delslot': { if (S.confirmDel!==+d.i){ S.confirmDel = +d.i; render(); setTimeout(()=>{ if (S.confirmDel===+d.i){ S.confirmDel=null; if (S.screen==='saves') render(); } }, 4000); break; } S.confirmDel=null; await deleteSlot(+d.i); S.slots = await listSlots(); S.slotCount = S.slots.length; render(); break; }
    case 'results': S.from = (S.screen==='weekdone'||S.screen==='weekmulti')? S.screen : 'home'; go('results'); break;
    case 'rdiv': S.tab.results = +d.d; render(); break;
    case 'resign': if (!S.confirmResign){ S.confirmResign = true; render(); toast('Tap again to hand in your notice.'); setTimeout(()=>{ S.confirmResign=false; if (S.screen==='home') render(); }, 4000); } else { S.confirmResign=false; E.resign(st); await save(); go('sacked'); } break;
    case 'takesack': { const err = E.takeSackOffer(st); if (err) toast(err); else { st.userSel = []; await save(); if (mgr().pendingReview) go('review'); else go('home'); } } break;
    case 'walkaway': {
      if (multi()){ E.retireManager(st, st.cur); if (E.activeManagers(st).length){ await save(); toast('Off into the sunset.'); startTurn(firstActive()); break; } }
      await Store.del(SAVE_KEY); S.state=null; S.hasSave=false; go('title'); break; }
    case 'home': go('home'); break;
    case 'sponsor': { const err = E.chooseSponsor(st, +d.i); if (err) toast(err); else { await save(); render(); } break; }
    case 'tickets': { const err = E.setSeasonTickets(st, +d.m); if (err) toast(err); else { await save(); render(); } break; }
    case 'loan': { const err = E.takeLoan(st, +d.amt); if (err) toast(err); else { toast('Money in.'); await save(); render(); } break; }
    case 'repay': { const err = E.repayLoan(st); if (err) toast(err); else { toast('Loan cleared.'); await save(); render(); } break; }
    case 'training': E.setTraining(st, d.t); render(); break;
    case 'staff': E.setStaff(st, d.r, +d.t); await save(); render(); break;
    case 'ticket': { const err = E.setTicketPrice(st, parseFloat(d.p)); if (err) toast(err); else { await save(); render(); } break; }
    case 'safety': { const err = E.improveSafety(st, +d.p); if (err) toast(err); else { toast('Work done.'); await save(); render(); } break; }
    case 'build': { const err = E.startBuild(st, +d.n); if (err) toast(err); else { toast('Builders booked.'); await save(); render(); } break; }
    case 'play': await playWeek(); break;
    case 'skipanim': if (S.finishAnim) S.finishAnim(); break;
    case 'afteranim': if (S.matchQueue && S.matchQueue.length){ S.results.userMatch = S.matchQueue.shift(); go('match'); startAnimation(); } else { S.results.userMatch = S.results.results.find(m=>!m.euro && (m.home.id===user().id||m.away.id===user().id)) || null; go('weekdone'); } break;
    case 'continue-week':
      if (st.gameOver){ S.pendingReview=false; go('sacked'); } else if (mgr().pendingReview){ S.pendingReview=false; go('review'); } else go('home');
      break;
    case 'acceptjob': E.acceptJob(st); st.userSel = []; await save(); render(); toast('New club, new problems.'); break;
    case 'declinejob': E.declineJob(st); await save(); render(); break;
    case 'newseason': st.userSel = (st.userSel||[]).filter(id=>st.players[id]&&st.players[id].club===st.userClub); mgr().pendingReview = false; await save(); go('home'); break;
  }
}

function firstActive(){ const st = S.state; const i = st.managers.findIndex(m=>!m.retired); return i<0? 0 : i; }
function startTurn(idx){
  const st = S.state; E.saveCurrent(st); E.setCurrent(st, idx);
  if (multi()) go('pass'); else arriveAtTurn();
}
function arriveAtTurn(){
  const st = S.state; const m = mgr();
  if (st.gameOver) go('sacked');
  else if (m.pendingReview) go('review');
  else go('home');
}
async function endTurn(){
  const st = S.state; const m = mgr(); m.ready = true; E.saveCurrent(st); await save();
  const next = st.managers.findIndex(x=>!x.retired && !x.ready);
  if (next>=0) startTurn(next); else await playWeek();
}
async function playWeek(){
  const st = S.state, u = user();
  const before = st.season;
  const week = st.week; const wk = st.schedule[week-1];
  if (!multi() && E.buildXI(st, u, sel(), u.formation).length<11) toast('Fewer than 11 fit players. Playing short.');
  const results = E.advanceWeek(st);
  S.pendingReview = st.season>before;
  S.results = { results, userMatch: null, week, type: wk.type, cup: wk.cup };
  await save();
  if (multi()){ go('weekmulti'); return; }
  const userMatch = results.find(m=>!m.euro && (m.home.id===u.id||m.away.id===u.id)) || null;
  const euroMatch = results.find(m=>m.euro && (m.home.id===u.id||m.away.id===u.id)) || null;
  S.results.userMatch = userMatch; S.results.euroMatch = euroMatch;
  S.matchQueue = [userMatch, euroMatch].filter(Boolean);
  if (S.matchQueue.length){ S.results.userMatch = S.matchQueue.shift(); go('match'); startAnimation(); }
  else go('weekdone');
}

// ---------- wiring ----------
let busy = false;
document.addEventListener('click', async e => {
  const n = e.target.closest('[data-nav]'); if (n){ if (S.anim || busy) return; go(n.dataset.nav); return; }
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (S.anim && t.dataset.a!=='skipanim') return;
  if (busy) return;
  busy = true;
  try { await act(t.dataset.a, t.dataset); } catch(err){ console.error(err); } finally { busy = false; }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && S.screen==='setup' && (S.setupCount||1)===1) act('start',{}); });

window.__sm91 = { S, E, render, go };
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
(async function init(){
  const saved = await load();
  if (saved){ S.state = saved; S.hasSave = true; }
  S.slots = await listSlots(); S.slotCount = S.slots.length;
  go('title');
})();
})();
</script>
